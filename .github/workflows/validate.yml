name: validate

# The PR gate. CONTRIBUTING tells a contributor to run tools/validate.pl before
# opening a PR; this is the same command, run where it cannot be forgotten.
#
# It is deliberately the SHAPE-AND-NAME check only, never the crackers.
# Verification needs hashcat, john, mdxfind and a GPU, none of which exist on a
# hosted runner, and tier 'vector' must never be reachable by anything a PR can
# influence. So this answers "is the entry well formed and does every
# identifier it names exist in the committed inventories?", which is the defect
# the old spreadsheet accumulated for three years, and stops there.
#
# Pull requests from forks get a read-only token by default and this job asks
# for nothing more: it reads, it reports, it writes nothing.

on:
  pull_request:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'tools/**'
      - 'vendor/**'
      - 'docs/index.html'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schema/**'
      - 'tools/**'
      - 'vendor/**'
      - 'docs/index.html'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # YAML::XS is the only non-core dependency, and Debian packages it, which
      # keeps CI consistent with how the tools are installed on the fleet
      # rather than pulling from CPAN.
      - name: Install Perl deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libyaml-libyaml-perl

      # A tool that no longer compiles is a broken gate, not a passing one, so
      # this runs before the gate itself.
      - name: Compile the tools
        run: |
          status=0
          for f in tools/*.pl tools/lib/*.pm; do
            perl -Itools/lib -c "$f" || status=1
          done
          exit $status

      - name: Validate
        run: perl -Itools/lib tools/validate.pl

      # House style is pure ASCII. An em-dash or a typographic quote is a
      # visible tell that prose was pasted from somewhere that reflows it, and
      # the generated CSV is consumed by tools that have no reason to expect
      # anything but ASCII. vendor/ is excluded: those files are upstream's,
      # copied verbatim, and rewriting one would create drift that
      # tools/fetch-upstream.sh is meant to detect.
      - name: ASCII only
        run: |
          bad=$(git ls-files -z ":!vendor/**" | xargs -0 grep -lP "[^\x00-\x7F]" || true)
          if [ -n "$bad" ]; then
            echo "non-ASCII bytes in:"; echo "$bad"
            echo "House style is ASCII. Use -- for an em-dash, -> for an arrow."
            git ls-files -z ":!vendor/**" | xargs -0 grep -nP "[^\x00-\x7F]" | head -40
            exit 1
          fi

      # A count in prose is wrong the day after it is written. Measured
      # 2026-09-02, MAINTAINING.md told a reader "772 entries with no
      # category:" and curate.pl's --help said "(772 open)" while the live
      # figure was 483 -- two surfaces describing one field, both confidently
      # wrong, neither the result of carelessness. This requires a count in a
      # document or in help text to carry an ISO date in its own paragraph, so
      # a reader can tell a measurement from a number that has rotted.
      # Design-rationale comments in tool source are a different genre and are
      # exempt; --comments checks them for anyone who wants it.
      - name: Counts are dated
        run: perl tools/check-numbers.pl --tracked

      # Canonical form, so a reviewer never has to read a one-line change
      # buried in a whole-file reformat, and so a misspelled key is caught
      # here rather than vanishing the next time a tool rewrites the entry.
      # --check writes nothing.
      - name: Check formatting
        run: perl -Itools/lib tools/fmt.pl --all --check

      # The other half of the gate above. fmt.pl asserts that the files ARE
      # canonical; this asserts that the canonical form gives the data back.
      # RosettaEmit is the single writer for data/algorithms and emit_entry
      # has no round-trip check of its own, so a seeding pass writes whatever
      # the emitter produces. The block scalar is the risk: it is the one form
      # here that can hand back a different string -- trailing whitespace, an
      # indented first line, a second trailing newline -- with nothing in the
      # file looking wrong. Every case that must stay quoted is asserted.
      - name: Exercise the entry emitter
        run: perl -Itools/lib tools/test-rosetta-emit.pl

      # RosettaJohn rewrites an hx expression into john's notation, and that
      # rewritten string is what john is asked to PROVE. A rewrite that drops
      # a token does not fail loudly, it manufactures a proof -- cap() on a
      # lowercase digest is a no-op on the inputs a test vector carries. The
      # refusals are the assertions that matter; this runs without john.
      - name: Exercise the expression translator
        run: perl -Itools/lib tools/test-rosetta-john.pl

      # RosettaExpr is the INDEPENDENT implementation triage uses as its
      # control, and on its answer curate.pl either files a human question or
      # suppresses one. An off-by-one in cut(), or a cap() that moved the
      # first character rather than the first lower-case letter, would report
      # correct expressions as wrong at scale rather than failing loudly. The
      # expected values are mdxfind's own hx engine's, measured; this step
      # checks the module against them and needs no hx binary. Re-measure the
      # fixture itself after an upstream pull with --oracle.
      - name: Exercise the independent expression evaluator
        run: perl -Itools/lib tools/test-rosetta-expr.pl

      # A disagreement with a vendored upstream that nobody executes is a
      # prose note, which is what this was until the register existed. Each
      # record fails three ways: upstream moved, our side moved, or the two
      # converged and the record is spent. The third is why this runs in CI --
      # it is the state change that otherwise looks exactly like nothing
      # having happened, and 'vendor/**' is a trigger path above so a re-fetch
      # is checked on arrival.
      - name: Execute the upstream-disagreement register
        run: perl -Itools/lib tools/check-upstream.pl --check -v

      # And prove the gate above can still fail. It passes every day until an
      # upstream catalog changes, which may be never, so a gate that had
      # quietly stopped working would be indistinguishable from a clean run.
      # Synthetic fixtures under tmp/; touches nothing real.
      - name: Exercise the register's failure modes
        run: perl -Itools/lib tools/test-check-upstream.pl

      # docs/index.html is the front door, and its behaviour is a string that
      # render.pl builds -- so a wrong array index or selector passes perl -c,
      # passes validate.pl, and silently breaks the page's search. node is
      # preinstalled on the runner; this needs nothing else.
      - name: Exercise the browsable page
        run: node tools/test-index-page.js docs/index.html

      # Every finding published to upstream has to still hold. --check writes
      # nothing; it re-verifies that each record's entry still makes the claim,
      # that each type is still spelled the way the binary spells it, and that
      # each quoted note still says what it is quoted for. A record that has
      # gone stale fails the build rather than staying on a page addressed to
      # somebody else's maintainers.
      - name: Upstream findings still hold
        run: perl -Itools/lib tools/upstream-findings.pl --check -v
