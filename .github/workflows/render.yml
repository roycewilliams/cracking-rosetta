name: render

# Rebuild the browsable views when - and only when - the state they are built
# from actually changes. Rendering is pure text: it reads the committed data
# and inventories and needs none of hashcat, john or mdxfind, so it runs on a
# hosted runner. Verification is the opposite and lives on a self-hosted
# runner; see tools/verify-vectors.pl.
#
# The paths filter is what stops this looping. This job commits docs/ and
# dist/ and nothing else, and neither is a trigger path, so its own push
# cannot start it again.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/render.pl'
      - 'tools/lib/**'
      - '.github/workflows/render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0, not the default 1, because tools/render.pl and
      # tools/upstream-findings.pl date their output from the last commit
      # touching their inputs rather than from the clock. In a shallow clone
      # the tip commit has no parent, so git reports it as touching every
      # path, and both stamps collapse to "the date of this push" -- which is
      # the date-only rewrite that dating from git was meant to prevent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # YAML::XS is the only non-core dependency. Debian packages it, which
      # keeps this consistent with how the tools are installed on the fleet
      # rather than pulling from CPAN.
      - name: Install Perl deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libyaml-libyaml-perl

      - name: Validate before rendering
        run: perl -Itools/lib tools/validate.pl

      - name: Render
        run: perl -Itools/lib tools/render.pl -v

      # Rendered here rather than in the validate workflow because it writes a
      # file, and this is the workflow that is allowed to commit one.
      - name: Render the upstream findings
        run: perl -Itools/lib tools/upstream-findings.pl -v

      - name: Commit only if something actually changed
        run: |
          if git diff --quiet -- docs dist README.md; then
            echo "- no change to the rendered views; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dist README.md
          git commit -m "Re-render browsable views" \
                     -m "Generated by tools/render.pl from ${GITHUB_SHA}."
          git push
