  because: 'The catalog is published from a release; the local binary is ahead of
    it. Measured 2026-09-02: 1000 catalog rows at v1.102 against 1002 types in mdxfind
    RCS 1.545. e1002 RMD256 is a hash type with no catalog row and therefore no example
    vector, which is why the extractor reports fewer vectors than types; e426 PARALLEL
    is a control type the catalog has never listed. The catalog SKIPS e426 rather
    than renumbering around it, so the two index spaces line up and can be compared
    directly -- that is what makes the agreement check below meaningful. CLAUDE.md
    records hashpipe as an alias of mdxfind rather than a fourth column "until that
    stops being true", and names a tools/extract-hashpipe.pl to detect the divergence.
    That tool does not exist. This record is that detector: on every shared index
    the catalog and the binary must agree on the name and on the hashcat mapping,
    and a mismatch means the alias rule needs revisiting. RE-MEASURED 2026-09-04 against
    mdxfind RCS 1.576: 1000 catalog rows against 1027 types, and the absent set grows
    from 2 to 27. The lag WIDENED rather than closed, and that is upstream''s own
    state rather than a stale local copy -- tools/fetch-upstream.sh was run the same
    day, upstream HEAD moved e528d881 to cad43ac7, and both vendored files came back
    byte-identical at v1.102. So re-fetching does not shrink this list and the record
    is the only thing that carries the gap. What the 25 new indices ARE is the reason
    to keep reading. They are EXACTLY the 25 names hashpipe had and mdxfind did not,
    which CLAUDE.md records as transient on upstream''s own account and tells a reader
