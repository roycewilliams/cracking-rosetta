- because: |-
    hashpipe v1.189 (commit ab66e0f) publishes 132 verified john-to-hashpipe rows. On the 126 this repository also names, the two agree; ONE does not.
    FOUR ROWS WERE DROPPED ON 2026-09-05, AND WHY IS THE POINT OF THIS RECORD. dynamic_54, _64, _74 and _84 were listed here as an "iteration-numbering" disagreement: hashpipe published SHA224RAWx01 and this repository asserted SHA224RAW x02, and the same for the SHA256, 384 and 512 siblings. That diagnosis was WRONG. It was not a convention difference; it was a BUG in the mdxfind build of the day, and upstream's map was right the whole time.
    mdxfind revision 1.290 (2026-04-09) regressed the RAW family as collateral to a buffer-aliasing fix: "the base was reported one round early, so x01 became X(pass) instead of X(X_bin(pass))", in upstream's own words, and "every RAW type became numerically identical to its plain sibling at x01". Revision 1.549 (2026-08-30) restored the correct semantics. This record was written on 2026-09-02 against an installed RCS 1.545, which still carried the regression, so the x02 it reported looked like a numbering convention rather than an off-by-one.
    Measured 2026-09-05 with a locally built RCS 1.576: every one of those entries' own stored vectors reproduces at x01, and `hashpipe -c` pinned to the same type independently reports x01. The entries were corrected to x01, check_john_map reported all four rows converged, and they are dropped from differs: here. This is the third failure mode this register exists to catch -- convergence, which looks exactly like nothing having happened -- and it is the first time it has fired.
    THE MD5CAP NUMBERING IS A SEPARATE AND STILL-REAL THING, and the old prose here conflated it with the above. JOB_MD5CAP's loop is `for (x = 2; x <= Maxiter; x++)` with checkhash INSIDE it, so mdxfind labels its first emitted value x02. That is genuine and survives: measured 2026-09-05 on RCS 1.576, MD5CAP still reproduces only at -i 2. It is not in differs: because john_map.h does not carry a row for it.
    THE ONE THAT REMAINS IS MASKING, which is upstream's own documented hazard rather than a numbering difference. hashpipe reports the FIRST type that reproduces a digest, and john's dynamic_37 is `sha1(lc($u).$p)`, which its own subformat listing labels SMF. Whenever the userid is already lower case that is byte-identical to `sha1($s.$p)`, so SHA1SALTPASS reproduces the vector without denoting the algorithm. john names this one for us directly, so the entry keeps SMF; per CLAUDE.md that coincidence is a collides-on-subset relation, not a mapping.
    NOTE WHAT IS DELIBERATELY NOT CHECKED. v1.189 also added JohnMapLocal[], 51 rows of config-defined dynamics. Upstream says their numbering is local to the generating machine and the table is for input only, and that is demonstrable here: upstream's dynamic_1013 is MD5PASSSALT and its dynamic_1014 is POSTGRESQL, while this host's john has them the other way round. check_john_map reads the first table only.
