- because: 'mdxfind 1.543 (2026-08-29) repaired a buffer-layout bug in e607. The old
    code staged the inner digest at linebuf+saltlen while writing the pepper at a
    fixed offset 32, so for any non-empty salt the hash covered the salt, then a TRUNCATED
    digest, then the pepper, and the output depended on the salt length. Upstream''s
    own revision note says any hash cracked as e607 before that revision will not
    verify against it. The catalog still publishes the PRE-FIX digest. The repaired
    construction sha1(md5(salt . pass) . pepper) was established three independent
    ways: the source at RCS 1.545, a Digest:: recomputation in perl that reproduces
    786aab... under the old layout and 0992047f... under the new, and the rebuilt
    binary cracking 0992047f... data/tools/mdxfind.yaml carries upstream''s value
    too, CORRECTLY -- it is generated from this catalog -- which is checked here so
    the generated layer cannot quietly stop matching the file it is generated from.'
