findings:
- document: hx specification, Appendix A
  evidence:
    entry: peoplesoft
    field: expression_proof.note
    mentions: Appendix A is wrong TWICE
  id: peoplesoft-e858-encoding-and-case
  kind: wrong-construction
  measured: 2026-09-02
  measured_with: mdxfind source RCS 1.545 (2026/08/29)
  states: sha1(utf16be(upper(pass)))
  subject: PEOPLESOFT (e858)
  summary: 'Two errors in one row. The row states the big-endian widening and a case
    fold; mdxfind.c''s JOB_PEOPLESOFT converts the candidate through an iconv descriptor
    opened UTF-8 to UTF-16LE//IGNORE and folds no case at all, then base64-encodes
    the raw 20-byte digest rather than hexing it. Corroborated four further ways,
    all independent of each other: mdxfind''s own hx VM built standalone from the
    same tree, a recomputation in Perl, hashcat -m 133, and john''s dynamic compiler.'
  we_measured: base64(sha1_raw(utf16le($p)))
- document: hx specification, Appendix A
  evidence:
    entry: md5-strtoupper-md5-md5-plain-true
    field: notes
    mentions: applies upper() to RAW BYTES
  id: md5rawuc-e383-upper-applied-to-raw-bytes
  kind: wrong-construction
  measured: 2026-09-02
  measured_with: john 1.9.0-jumbo-1+bleeding-9a336d800a
  states: hex(upper(md5_bin(pass)))
  subject: MD5RAWUC (e383)
  summary: The row applies upper() to RAW BYTES and hexes the result afterwards, which
    is not the same operation as upper-casing the hex text and is not what the type
    does. The entry carrying this type reaches tier vector with the upper() outside
    the hex-emitting call, proven by john's own dynamic compiler against the entry's
    own vector. Note that the entry is at -i 2, so its expression carries one more
    round than the row describes; the defect being reported is the placement of upper(),
    which is independent of the iteration count.
  we_measured: md5(upper(md5(md5_raw($p))))
- document: hx specification, Note [24]
  evidence:
    check:
    - multi-emit
    types:
    - MD5BASE64MD5RAWSHA1
    - MD5BASE64MD5RAWMD5
    - MD5BASE64MD5RAWMD5MD5
    - MD5SQL5-32
  id: note-24-blind-to-fallthrough
  kind: omission
  measured: 2026-09-05
  measured_with: mdxfind.c
  states: 34 types emit several candidate digests per input
  subject: 4 multi-emit types the note does not name
  summary: 'Note [24] enumerates the types that emit more than one digest per input.
    Four are absent from it, by name and by index. MD5BASE64MD5RAWSHA1 (e242), MD5BASE64MD5RAWMD5
    (e243) and MD5BASE64MD5RAWMD5MD5 (e244) fall through to the b64md5raw label, which
    computes a second digest over len-2 and checks both, so they belong in the same
    paragraph as e237 and e375. MD5SQL5-32 (e342) fills mdcur[0] through mdcur[7]
    and emits eight digests per password, over the upper- and lower-case renderings
    with and without the leading "1" and "*". Narrowed here from eleven types to four
    on 2026-09-05: Note [24] has since grown to name the other seven.'
  we_measured: at least 4 more do, by reading the cases in mdxfind.c
- document: hx specification, Note [24]
  evidence:
    check:
    - multi-emit
    types:
    - MD5BASE64SHA1RAW
    - MD5UCBASE64SHA1RAW
  id: doc-only-multi-emit-note-24
  kind: wrong-construction
  measured: 2026-09-05
  measured_with: mdxfind.c, the JOB_MD5BASE64SHA1RAW case
  states: both emit the full-length base64 string and a 2-character-shorter variant
  subject: MD5BASE64SHA1RAW (e238), MD5UCBASE64SHA1RAW (e376)
  summary: 'Note [24] groups these two with e237 MD5BASE64MD5RAW and e375 MD5UCBASE64MD5RAW
    as emitting both the full base64 string and a two-character-shorter variant. mdxfind
    has two code paths and only one does that: b64md5raw computes a second digest
    over len-2, b64sha1raw sets x = 1 and goes straight to MDstart. The difference
    is arithmetic rather than an oversight in the code -- an md5 digest is 16 bytes
    and its base64 ends in two "=" characters, while a sha1 digest is 20 and its base64
    ends in one, so for the SHA1RAW pair there is no two-character variant to take.
    Narrowed here from six types to two on 2026-09-05: the other four -- SHA1MD5BASE641SALT,
    SHA1MD6TRUNC, SHA1SALTSHA256UCTRUNC and SHA1SALTSHA512UCTRUNC -- are multi-emit
    in the source, so the note was right about them and the earlier measurement was
    wrong.'
  we_measured: one emission each; there is no shorter variant to take
- document: vendored hashpipe HASH_TYPES.md
  evidence:
    computed: uppercase-example-digest
  id: uppercase-example-digests
  kind: wrong-construction
  measured: 2026-09-05
  measured_with: mdxfind.c and mdxfind RCS 1.576 (2026/09/02)
  states: md5_uc(pass), sha1_uc(pass), sha256_uc(pass), hex(upper(md5_bin(pass)))
  subject: 'the UC family: MD5UC (e2), SHA1UC (e182), SHA256UC (e488), MD5RAWUC (e383)'
  summary: 'RE-DIAGNOSED 2026-09-05 against mdxfind.c. This was recorded as a RENDERING
    fault -- an example printed in upper-case hex that the loader declines -- and
    re-casing was reported as no general fix because MD5UC, SHA256UC and RACF reproduced
    in neither case. The reason they do not is not the case of the letters. Each of
    these types renders its digest as upper-case hex with prmd5UC and then sets x
    = 2 before entering the iteration loop, so the value it presents for matching
    is one further hash OVER that upper-case hex, and it is reported at x02 because
    there is no x01. The published example is the INTERMEDIATE, the string at the
    moment prmd5UC produces it, which the type never offers. Measured for each: md5(md5_uc(pass))
    is cb8bca2e221b4ae44c95ca2f70f8f407 and mdxfind reports it as MD5UCx02; sha1(sha1_uc(pass))
    and sha256(sha256_uc(pass)) behave identically under e182 and e488. So no amount
    of re-casing was ever going to make these read back, which is why the earlier
    note could not explain them. The Appendix A rows have been corrected; the example
    vectors are hashpipe\x27s and are reported here rather than patched locally.'
  we_measured: each type reports one further hash OVER that upper-case hex, first
    at x02
version: 1
