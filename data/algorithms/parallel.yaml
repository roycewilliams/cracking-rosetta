id: "parallel"
name: "PARALLEL"
status: "ok"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["PARALLEL"]
    verified: "asserted"
    verified_at: "2026-09-04"
    verified_with: "mdxfind RCS 1.576 (2026/09/02)"
    note: "PARALLEL is not a hash. mdxfind's maintainer describes it as a measurement tool rather than an algorithm, and it emits nothing: measured 2026-09-04, run pinned with -M under -z alone, with -s and with -u, stdout empty in every case. So this entry can never reach tier vector and the absence of a vector is a property of the type, not a gap in this repository. The identifier itself is real -- it is in mdxfind's own type table -- and that is all the mapping claims."
  crack:
    supported: false
no_vector:
  reason: "impossible"
  note: "PARALLEL computes nothing. mdxfind.c's JOB_PARALLEL case is `hashcnt += Maxiter; break;` -- it advances the hash counter and returns, computing no digest and calling no checkhash -- so there is no hash for any plaintext to produce and no vector can exist. That is also why e426 is the single index mdxfind has that hashpipe does not: there is nothing there to implement. The source and the measurements agree. Pinned with -M under -z, alone and with -s and with -u, stdout was empty in every case; hashpipe registers PARALLEL with no ht->example, so `hashpipe -T` skips it, and `hashpipe -G` -- which generates a vector for a type that has none -- emits nothing for it either, having no compute function to drive. Unchanged in mdxfind 1.577, which touched only revision notes."
  measured_at: "2026-09-04"
  measured_with: "mdxfind RCS 1.576 (2026/09/02); hashpipe RCS 1.192 (2026/09/04)"
notes: "No vector exists to seed, measured 2026-09-04, and this is the one type in the inventory for which that is a fact about the tools rather than a gap in this repository. hashpipe registers PARALLEL with no ht->example at all, so `hashpipe -T` skips it -- it is one of the two skipped types the generated data/tools/hashpipe.yaml header names -- and `hashpipe -G`, which generates a vector for a type that has none, emits nothing for it either because it has no compute function and no chain to drive. mdxfind's own inventory row (e426) carries no example_vector, and e426 is the single index mdxfind has that hashpipe does not. So nothing here is waiting on a contribution: no_vector records that as a property of the type rather than as a gap in this repository."
