id: "apple-secure-notes"
name: "Apple Secure Notes"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat mode 16200 is a Document format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "Apple Secure Notes"
  source: "hashcat"
  note: "hashcat's own label for mode 16200, category \"Document\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "application"
status: "ok"
tools:
  hashcat:
    modes: [16200]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "hashcat's own published example hash for this mode, recovered by hashcat at this mode with hashcat's own published plaintext."
  hashpipe:
    types: ["APPLE-SECURE-NOTES"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    cpu: ["notes"]
    gpu: ["notes-opencl"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "john"
    note: "format discovered by round-trip search, not by name"
  crack:
    supported: false
