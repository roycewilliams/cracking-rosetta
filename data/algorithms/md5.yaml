relations:
  - kind: "collides-on-subset"
    entry: "md5cap"
    distinction: "encoding"
    note: "MD5CAP is cap(md5($p)), a no-op whenever the digest contains no letters to capitalize, so john's dynamic_2 and plain MD5 crack its vector without denoting it"
  - kind: "encodes"
    entry: "md5cdab-order-of-32bit-values"
    distinction: "encoding"
    note: "the vector is md5($p) with its four 32-bit output words reordered c,d,a,b: md5('rosetta') is 975790df b2854c88 094fe624 77a7d5f3 and the entry carries 094fe62477a7d5f3975790dfb2854c88. Confirmed 2026-08-31 with Digest::MD5, independent of all three crackers. No tool implements the reordering: mdxfind ships MD5dcab and MD5bcad but no cdab, and neither reproduces this vector when pinned"
  - kind: "encodes"
    entry: "md5uc"
    distinction: "encoding"
    note: "MD5UC is the same digest written in uppercase hex; john and hashcat both fold the case on load, which is why the same identifiers crack both"
  - kind: "iterates"
    entry: "md5-md5-md5-md5-md5-pass"
    distinction: "iteration"
    note: "Both rows name mdxfind type MD5; this one at -i 5 and md5 at -i 1. The iteration suffix is part of the identity (MD5x02 is john's dynamic_2, MD5x03 its dynamic_3), so these are two algorithms and not two names. Edge written 2026-09-07 from the data: same type, different iterations: is what `iterates` means, and no judgment was involved."
