id: "md5-base64-encode-md5-md5-plain-true"
name: "md5(base64_encode(md5(md5($plain), true)))"
aliases: ["md5(substr(base64_encode(md5(md5($plain), true)), 0, -2))"]
expression_proof:
  verified: "absent"
  verified_at: "2026-09-02"
  verified_with: "mdxfind RCS 1.545 (2026/08/29), source and -z emission count"
  note: "WITHDRAWN 2026-09-02. This row carried md5(base64(md5_raw(md5($p)))) at tier upstream, transcribed from hx Appendix A for e243, and triage recorded it as reproducing 1 of 2 vectors. Both vectors are correct and the expression was the false claim: mdxfind type MD5BASE64MD5RAWMD5 is MULTI-EMIT, so no single expression describes it. mdxfind.c b64md5raw computes md5 of the whole 24-character base64 into mdcur[0] and, under if (len > 18), md5 of the same base64 minus its last two characters into mdcur[1], then checkhash()es both. mdxfind -z counts 2 emissions for this type, RCS 1.545, measured 2026-09-02. mdxfind own hx VM reproduces this row first vector from the padded form and its second from the 22-character form, so the two vectors corroborate the type rather than contradicting each other."
denotation:
  text: "MD5BASE64MD5RAWMD5 is MULTI-EMIT: it matches either md5(base64(md5_raw(md5($p)))) or md5(cut(base64(md5_raw(md5($p))),0,22)), which is the same base64 with its \"==\" padding removed"
  source: "mdxfind"
  note: "Both forms verified against this row own vectors with mdxfind hx VM, built -DHX_STANDALONE from RCS 1.545, on 2026-09-02. The alias this row already carried, md5(substr(base64_encode(md5(md5($plain), true)), 0, -2)), is the second emission written in the sheet notation."
