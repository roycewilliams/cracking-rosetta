id: "sha1raw-substr-0-32"
name: "sha1(sha1_raw($pass)).Substr(0, 32)"
expression: "cut(sha1(sha1_raw($p)),0,32)"
expression_proof:
  verified: "upstream"
  verified_at: "2026-09-06"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "john's own --list=subformats states dynamic_1028 as \"sha1(sha1_raw($p)) (hash truncated to length 32)\", for an identifier this row proves by round-trip, and the construction was recomputed independently here with Digest::MD5 and Digest::SHA against john's published Test= vector before it was stored. Tier stays upstream and CANNOT become vector, for the same reason sha1-substr-0-32 records: cut() has no john dynamic spelling at all (RosettaJohn %NO_JOHN), so john's compiler can never be handed this string, and there is no john_dynamic_expr on this row for the same reason -- dropping the cut would run happily and produce the full digest, not the 32 hex characters stored here.; TRIAGE 2026-09-08 [compiler-cannot]: the expression is correct -- computed here with Digest:: it reproduces all 6 of john's own test vectors for dynamic_1028 -- and john's ad-hoc compiler still recovers none of them, so the string is right and --format=dynamic cannot execute it"
