notes: "Created 2026-09-06. This row exists because dynamic_1028 was sitting on sha1raw, which computes the same thing UNTRUNCATED, and the mapping was false. Measured that day, with the vector spelled $dynamic_1028$<hash> so that the parser could not be the variable: dynamic_1028 cracks the first 32 hex characters of sha1raw's own digest, and handed that row's FULL digest it does not load at all. A format that refuses the string is not a format that computed it and missed. The vector(s) here are john's own published Test= lines from run/dynamic.conf, each recomputed independently with Digest:: before being stored. Note what this row is NOT: mdxfind's TRUNC family truncates the INNER digest and hashes the result, which is a different construction -- see sha1sha1trunc and its neighbours."
