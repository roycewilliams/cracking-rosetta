  john:
    cpu: ["HMAC-SHA384"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "WITHDRAWN 2026-09-05: this row said john had no format for this computation, and john has had one all along. The same NAME means opposite things in john and mdxfind, which is what put this mapping on the wrong row. john's HMAC-* formats key on the PASSWORD -- john's own source says so, ALGORITHM_NAME is literally \"password is key\" in hmacMD5_fmt_plug.c, hmacSHA1_fmt_plug.c, hmacSHA256_fmt_plug.c and hmacSHA512_fmt_plug.c. mdxfind splits the two cases across two names: hx Appendix A gives HMAC-SHA1 (e215) as hmac_sha1(pass, user), keyed on the USER, and HMAC-SHA1-KPASS (e793) as hmac_sha1(salt, pass), keyed on the PASSWORD. So john's HMAC-SHA1 is mdxfind's HMAC-SHA1-KPASS, and matching the two by name pairs each with the wrong one. john's HMAC-SHA384 recovers this row's own plaintext from its own vector once that vector is written in john's <message>#<digest> shape. Superseded note follows. || no format. Swept the 20 format(s) whose own valid() accepts this entry's own vector, as john --show=left reports them, on 2026-09-04 (a tools/discover-john.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. For john the control is also per ENTRY and not only per shape: every format counted above is one whose own loader ACCEPTED this hash, so each was asked this exact question and answered no. A format that cannot parse the hash is not counted at all, and an entry no format can parse is reported as unsearched rather than decided. Every applicable format ran to completion; a format killed at the timeout is counted as untested and withholds this verdict. No john format name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if john gains one, this becomes a mapping."
  crack:
    supported: false
relations:
  - kind: "same-computation"
    entry: "hmac-sha384-johnhmac-sha384"
    distinction: "naming"
    note: "Measured 2026-09-04, same as the hmac-sha1 pair: mdxfind pinned to HMAC-SHA384-KPASS reproduces this rows RFC 4231 vector in mdxfinds serialization, and hmac-sha384-kpass already stands at tier vector for the same type."
