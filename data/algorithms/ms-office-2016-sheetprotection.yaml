    modes: [25300]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "hashcat's own published example hash for this mode, recovered by hashcat at this mode with hashcat's own published plaintext."
  john:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a"
    note: "no format. --list=formats offers only Office and oldoffice, which are MS-OFFCRYPTO document ENCRYPTION and a different mechanism entirely. office2john reads that encryption verifier out of the OLE/agile container and finds nothing here, because a protected sheet is not encrypted at all -- the digest sits in cleartext in the part XML."
