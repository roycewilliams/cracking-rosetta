id: "sha1-md5-md5-plain-plain"
name: "sha1(md5(md5($plain).$plain)"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type SHA1MD5MD5PASS (e663) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "emit(sha1(md5(md5(pass).pass))); emit(sha1(md5(md5(pass).\":\".pass) . fromhex(\"00\")))"
  source: "mdxfind"
  note: "hx Language Specification, Appendix A, vendored as vendor/cynosureprime/hx.8 at commit 2139193c, entry for mdxfind type SHA1MD5MD5PASS (e663), which states emit(sha1(md5(md5(pass).pass))); emit(sha1(md5(md5(pass).\":\".pass) . fromhex(\"00\"))). CORRECTED 2026-09-05: this entry recorded emit(sha1(md5(md5(pass).pass))); emit(sha1(md5(md5(pass).\":\".pass))), and the two disagreed about the algorithm. The trailing NUL is real and is part of the digest. The second emission is mysha1(newbuf, 33, mdcur[1].h) over a buffer holding a 32-character hex string, and prmd5 NUL-terminates at out[len], so byte 33 is a zero byte. That is the fromhex(00) the specification records and the text here omitted -- the same prmd5 boundary this project already documents as part of the output rather than an artifact. mdxfind.c is authoritative and it agrees with the specification, so the entry is what changed. Found by tools/audit-denotations.pl, which compares every denotation against the vendored appendix."
status: "ok"
