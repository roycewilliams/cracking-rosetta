id: "sha1lsb35"
name: "SHA1lsb35"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "the construction upstream states for mdxfind type SHA1lsb35 (e409) names and(), which john's dynamic EXPRESSION vocabulary does not have -- checked against the function names appearing in john's own --list=subformats, so this is a lookup and not an opinion. It says nothing about whether john can CRACK this: john has formats for plenty of these constructions, and where it does they are in tools.john.cpu. The wording upstream uses is kept in denotation:."
denotation:
  text: "hex(and(sha1_bin(pass), \"\\x00\\x0f\\xff...\\xff\"))"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type SHA1lsb35 (e409), which states hex(and(sha1_bin(pass), \"\\x00\\x0f\\xff...\\xff\")) (nibble mask)."
status: "ok"
tools:
  hashcat:
    verified: "absent"
    note: "hashcat -m 100 DOES report cracking both of this row's vectors, and that is not a mapping. Measured 2026-08-31: -m 100 skips hash positions 0-7, which is exactly the field this type masks, so it cannot tell this row from a plain SHA-1. discover-hashcat.pl's canary withheld the claim. hashcat has no mode for the masked construction; john does, and it is in tools.john.cpu."
  mdxfind:
    types: ["SHA1lsb35"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["SHA1lsb35"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    cpu: ["Raw-SHA1-Linkedin"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john's own test vector for this format is reproduced by mdxfind pinned to SHA1lsb35 at iteration 1"
  crack:
    supported: false
relations:
  - kind: "collides-on-subset"
    entry: "aich"
    distinction: "truncation"
    note: "AICH of a single block is SHA-1, and SHA1lsb35 is SHA-1 with the leading nibbles masked to zero, so any tool that ignores that field -- hashcat -m 100 skips positions 0-7 and john Raw-SHA1-Linkedin skips 0-4, measured 2026-09-01, and the mask is 5 nibbles wide -- reports one for the other. They agree on every input outside those nibbles and differ nowhere else that such a tool looks."
  - kind: "collides-on-subset"
    entry: "sha1uc"
    distinction: "truncation"
    note: "SHA1UC is SHA-1 written in uppercase hex and SHA1lsb35 is SHA-1 with the leading nibbles masked to zero, so a tool that skips that field cannot tell them apart: hashcat -m 100 skips hash positions 0-7 and john Raw-SHA1-Linkedin skips 0-4, measured 2026-09-01. SHA1lsb35 masks exactly 5 nibbles, so either blind spot covers the whole difference: the digests are identical from position 5 onward."
