notes: "THE ALIAS hmac(\"ripemd320\", $plain, $salt) MISSTATES THE KEY ORDER AND IS KEPT ANYWAY, decided by Royce 2026-09-07, because it is a name people search by. Read it as a LABEL, not a specification: it reads as key=$plain, and this row's computation is key=$salt. Recomputation settled that on 2026-09-07 rather than either name -- hmac(key => salt, msg => pass) reproduces the stored digests of both merged rows and hmac(key => pass, msg => salt) reproduces neither -- and hashcat agrees: its key=$pass modes are a different number and neither row ever named one. The name: field above is the authoritative one."
