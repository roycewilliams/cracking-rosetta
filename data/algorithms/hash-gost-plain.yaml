relations:
  - kind: "collides-on-subset"
    entry: "dynamic-1031"
    distinction: "truncation"
    note: "Measured 2026-09-05. john states dynamic_1031 as \"gost($p) (hash truncated to length 32)\"; the two agree on the first 32 hex characters of gost($p) and nowhere else. mdxfind's GOST recovers the 32-hex vector by comparing at the shortest loaded length, which is a capability rather than an identifier for the truncation."
  - kind: "duplicate-of"
    entry: "gost-r-34-11-94"
    distinction: "none"
    note: "merged 2026-09-07: Merged 2026-09-06, decided by Royce. These five john-named rows and their survivors are one computation, proven twice over: john's dynamic compiler recovers each loser's own plaintext from its own hash under the expression the survivor already carries at tier vector (gost($p), haval128_4($p), sha3_512($p), ripemd128($p), ripemd160($p)), and mdxfind pinned to ONE type reproduces BOTH rows' vectors on two different plaintexts. NOT the streebog-64-plain/gost2012-64 case, which stayed two rows under distinction naming: there the two rows carried two DIFFERENT mdxfind types, so each name had an identifier of its own. Here both rows carried the SAME type, and the loser was a strictly poorer view -- john's named format and nothing else, no hashcat mode, no hashpipe block -- so a reader arriving by john's label was landing on an incomplete answer. The label survives as an alias and as a john identifier on this row, and the tombstone redirects."
  - kind: "iterates"
    entry: "gost-x2"
    distinction: "iteration"
    note: "Both rows name mdxfind type GOST; this one at -i 2 and hash-gost-plain at -i 1. The iteration suffix is part of the identity (MD5x02 is john's dynamic_2, MD5x03 its dynamic_3), so these are two algorithms and not two names. Edge written 2026-09-07 from the data: same type, different iterations: is what `iterates` means, and no judgment was involved. Measured 2026-09-05. john states dynamic_1031 as \"gost($p) (hash truncated to length 32)\"; the two agree on the first 32 hex characters of gost($p) and nowhere else. mdxfind's GOST recovers the 32-hex vector by comparing at the shortest loaded length, which is a capability rather than an identifier for the truncation."
