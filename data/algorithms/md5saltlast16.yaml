id: "md5saltlast16"
name: "MD5SALTLAST16"
denotation:
  text: "cut(md5(md5(pass) . salt), -16)"
  source: "mdxfind"
  note: "hx 1.5 Appendix A (e1041). Salted, and deliberately single-depth: only the LAST 16 hex of the digest are stored (the last 8 bytes copied to the front of a scratch union and reported as a 16-hex field), so there is nothing defined to iterate and an -i 2 line does not verify. Not expressible in this repository's hx notation, which has no negative/tail cut."
category: "composite"
status: "needs-review"
