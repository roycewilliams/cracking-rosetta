    types: ["MD5SALTLAST16"]
    verified: "vector"
    verified_at: "2026-09-27"
    verified_with: "mdxfind RCS 1.606 (2026/09/27)"
    note: "generated with mdxfind -z and crack-back verified under the local build pinned with -h '^MD5SALTLAST16$'; verify-vectors.pl promotes to tier vector. Upstream added this type 2026-09-27 (mdxfind RCS 1.604-1.606, hashpipe 1.213); the vendored catalog does not yet carry an example."
  hashpipe:
    types: ["MD5SALTLAST16"]
    verified: "vector"
