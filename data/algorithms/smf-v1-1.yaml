notes: "(using lowercase username as salt) Vector 'john' added 2026-09-06: the SAME credential already above, re-serialized into the form john's dynamic_37 reads. It is not independent evidence -- do not read two agreeing vectors here as corroboration. The two spellings differ in where the USERNAME goes: this row stores SMF's own <hash>:<user>, and dynamic_37 -- sha1(lc($u).$p) -- takes the username in a $$U field, $dynamic_37$<hash>$$U<user>. Measured 2026-09-06: handed the colon form, dynamic_37 answers \"No password hashes loaded\", while dynamic_25 reads it unchanged because it treats the same trailing field as a salt. The re-encoding was not assumed: the $$U string was handed to john with only the plaintext the stored vector already states, and fell."
