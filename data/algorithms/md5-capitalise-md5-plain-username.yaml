    note: "no john format reproduces this construction: discover-john.pl ran all 957 formats (439 CPU + 518 disabled dynamics) against this entry's vector in 38.5s with zero matches, 2026-08-31. Separately, the dynamic expression compiler cannot express it either -- it has no literal-string token. The dynamic_1007/2006/6 this entry used to name belong to the colonless md5(md5($p).$s) and do not crack this vector."
