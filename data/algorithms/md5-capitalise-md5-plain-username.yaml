    entry: "md5-md5-plain-salt-3"
    distinction: "encoding"
    note: "MD5MD5USER and MD5CAPMD5USER differ only by cap() on the inner hex digest, which is a no-op whenever that digest starts with a digit. md5('rosetta') is 975790df..., so both types reproduce this shared vector identically; they diverge on any plaintext whose md5 starts with a letter."
