id: "md5-capitalise-md5-plain-username"
name: "md5(cap(md5($plain)).\":\".$username)"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "john's dynamic expression language has no literal-string token: --format=dynamic='md5(md5($p).\":\".$s)' fails with 'Invalid token following the . character' (checked 2026-08-31), so this construction cannot be written as an expression. That is separate from whether john has a FORMAT for it."
denotation:
  text: "MD5CAPMD5USER is MULTI-EMIT: it matches either md5(cap(md5($p)).$u) or md5(cap(md5($p)).\":\".$u)"
  source: "mdxfind"
status: "ok"
