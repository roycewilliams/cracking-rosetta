id: "sha1lsb32"
name: "SHA1lsb32"
expression: "cut($c1.cut(sha1($p),8),0,32),c1=00000000"
expression_proof:
  verified: "upstream"
  verified_at: "2026-09-06"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A; mdxfind.c RCS 1.576 (2026/09/02)"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type SHA1lsb32 (e398), which states \"00000000\" . cut(sha1(pass), 8), and CORRECTED 2026-09-06 for the comparison width. Appendix A states the 40-character construction; mdxfind stores and matches only its first 32. mdxfind.c JOB_SHA1lsb32 zeroes the leading four bytes of the digest (curin.i[0] = 0) and then calls checkhash(&curin, 32, x, job), so the width is stated in the source and never reached the expression -- which is why the uncorrected string yielded 0000000008f9cab4083784cbd1874f76618d2a97 where this entry's own vector is its first 32 characters, and why triage flagged it expression-wrong on 2026-09-05. The vector was never in doubt: it is upstream's and hashpipe reproduces it pinned to this type. RosettaExpr, an implementation independent of all three crackers, now reproduces it from the corrected string. Still upstream and not vector: john's dynamic expression language has no substring operator, so nothing has compiled this string and round-tripped it."
category: "composite"
status: "ok"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "no mode. Swept the 12 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-03 (tools/discover-hashcat.pl --all, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["SHA1lsb32"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["SHA1lsb32"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    verified: "absent"
    verified_at: "2026-09-04"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "no format. Swept the 76 format(s) whose own valid() accepts this entry's own vector, as john --show=left reports them, on 2026-09-04 (a tools/discover-john.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. For john the control is also per ENTRY and not only per shape: every format counted above is one whose own loader ACCEPTED this hash, so each was asked this exact question and answered no. A format that cannot parse the hash is not counted at all, and an entry no format can parse is reported as unsearched rather than decided. Every applicable format ran to completion; a format killed at the timeout is counted as untested and withholds this verdict. No john format name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if john gains one, this becomes a mapping."
  crack:
    supported: false
