id: "md5-plain-md5-plain"
name: "md5($plain.md5($plain))"
aliases: ["md5($plain.\":\".md5($plain))"]
expression_proof:
  verified: "absent"
  verified_at: "2026-09-02"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type MD5PASSMD5 (e201) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "md5(pass . md5(pass))"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type MD5PASSMD5 (e201), which states md5(pass . md5(pass)) (Note [24]). This is what the type emits, not a single construction -- see expression_proof."
status: "ok"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "no mode. Swept the 12 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-03 (tools/discover-hashcat.pl --all, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalised by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["MD5PASSMD5"]
    verified: "vector"
    verified_at: "2026-08-29"
    verified_with: "mdxfind"
  crack:
    supported: false
relations:
  - kind: "collides-on-subset"
    entry: "md5-pass-md5-salt"
    distinction: "salt-convention"
    note: "md5($p.md5($p)) and md5($p.md5($s)) agree exactly when the salt is the password, which two of john's four dynamic_1011 test vectors happen to do"
