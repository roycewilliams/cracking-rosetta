notes: "Vector 'john' added 2026-09-06: the SAME credential as this row's hashcat vector, re-serialized into the form john's plaintext format reads. It is not independent evidence -- do not read two agreeing vectors here as corroboration. All three tools spell a cleartext 'hash' differently: hashcat takes the string itself, mdxfind takes it null-padded and hex-encoded, and john wants a $0$ tag in front of it, which is the shape of its own published example $0$cleartext. Measured 2026-09-06: handed the bare string, john's plaintext format answers \"No password hashes loaded\". The re-encoding was not assumed: the tagged string was handed to john with only the plaintext the stored vector already states, and fell."
