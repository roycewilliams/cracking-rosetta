id: "sha256uc"
name: "SHA256UC"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "the construction upstream states for mdxfind type SHA256UC (e488) names sha256_uc(), which john's dynamic EXPRESSION vocabulary does not have -- checked against the function names appearing in john's own --list=subformats, so this is a lookup and not an opinion. It says nothing about whether john can CRACK this: john has formats for plenty of these constructions, and where it does they are in tools.john.cpu. The wording upstream uses is kept in denotation:."
denotation:
  text: "sha256_uc(pass)"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type SHA256UC (e488), which states sha256_uc(pass)."
status: "needs-review"
tools:
  mdxfind:
    types: ["SHA256UC"]
    verified: "asserted"
    no_round_trip:
      reason: "not-comparable"
      note: "mdxfind cannot present this row's vector, and that is a property of how it compares rather than a defect. It converts a loaded hash to binary, so upper(sha256($p)) and sha256($p) are the same bytes to it -- offer it this row's digest and it answers SHA256x01, because that is what those bytes are. A type distinguished only by hex case therefore cannot exist for mdxfind at depth one, and the first depth it can present is one hash further on, which it reports as SHA256UCx02. hashpipe compares the stored text, can tell the two apart, and verifies this row's vector as SHA256UCx01. Both are correct and they are not in conflict: each reports the first value its own comparison can distinguish. Appendix A's row, sha256_uc(pass), states the construction both implement. Measured 2026-09-05 against mdxfind RCS 1.576 and hashpipe RCS 1.193."
      measured_at: "2026-09-05"
      measured_with: "mdxfind RCS 1.576 (2026/09/02); hashpipe RCS 1.193 (2026/09/05)"
  hashpipe:
    types: ["SHA256UC"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e488 SHA256UC. verified with hashpipe -c, which pins each line to its own leading TYPE label and runs no detection, at -t 1 and with the emitted label compared against the one asked for. Both precautions matter on this build: -m does not restrict what a recognised wrapper reaches, and results vary with the thread count. No iterations: is recorded from hashpipe -- the suffixes are different quantities and this repository follows mdxfind for that field."
  crack:
    supported: false
vectors:
  - hash: "EF92B778BAFE771E89245B89ECBC08A44A4E166C06659911881F383D4473E94F"
    pass: "password123"
    source: "hashpipe"
notes: "The vector is hashpipe's published example and mdxfind will not read it back in EITHER case, so the mdxfind mapping stays at tier `asserted`. Measured 2026-09-04, and the measurement narrows the fault rather than widening it: the digest IS sha256 of the plaintext. Lower-cased and offered to mdxfind's own SHA256 type it reproduces immediately as SHA256x01, which is the positive control that makes the silence above evidence. So the catalog's digest is correct and it is mdxfind's SHA256UC type that cannot read its own example. See docs/UPSTREAM-FINDINGS.md, which lists this type among those whose example digest is rendered in upper-case hex."
