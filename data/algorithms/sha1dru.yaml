id: "sha1dru"
name: "SHA1DRU"
expression_proof:
  verified: "absent"
  verified_at: "2026-09-02"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "the construction upstream states for mdxfind type SHA1DRU (e404) is a multi-statement hx PROGRAM -- it assigns to a variable and loops over the characters of the password. john's dynamic expression language has no statements, no assignment and no iteration: doc/DYNAMIC_EXPRESSIONS requires a SINGLE outer crypt-hash expression, so this is not a gap a wider function vocabulary could ever close. Verified against mdxfind's own source on 2026-09-02 (RCS 1.545), which implements exactly the loop upstream describes and emits one candidate. It says nothing about whether john can CRACK this."
denotation:
  text: "h=sha1_bin(pass); for i=1 to 1000000 { h=sha1_bin(sha1(h).pass) }; sha1(h)"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type SHA1DRU (e404), which states h=sha1_bin(pass); for i=1 to 1000000 { h=sha1_bin(sha1(h).pass) }; sha1(h)."
status: "ok"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "no mode. Swept the 7 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-03 (tools/discover-hashcat.pl --all, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalised by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["SHA1DRU"]
    verified: "vector"
    verified_at: "2026-08-30"
    verified_with: "mdxfind"
  hashpipe:
    types: ["SHA1DRU"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  crack:
    supported: false
