id: "sha1sha1pass-trunc1salt"
name: "SHA1SHA1PASS-TRUNC1SALT"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type SHA1SHA1PASS-TRUNC1SALT (e639) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "sha1(sha1(sha1(pass) . cut(pass, 0, 3)) . salt)"
  source: "mdxfind"
  note: "hx Language Specification, Appendix A, vendored as vendor/cynosureprime/hx.8 at commit 2139193c, entry for mdxfind type SHA1SHA1PASS-TRUNC1SALT (e639), which states sha1(sha1(sha1(pass) . cut(pass, 0, 3)) . salt). CORRECTED 2026-09-05: this entry recorded sha1(cut(sha1(pass), 0, N) . salt), and the two disagreed about the algorithm. There is no truncation of the sha1 anywhere in this type. mdxfind appends the first THREE characters of the password to the sha1 hex and re-hashes -- fastcopy(linebuf+40, cur, 3); mysha1(linebuf, 40+3, curin.h); -- then sweeps a single-byte salt from 0x09 to 0x7f: for (y=9; y < 128; y++) { linebuf[40] = y; mysha1(linebuf, 40+1, curin.h); }. The text recorded here described a cut() of the sha1 that the code never performs. mdxfind.c is authoritative and it agrees with the specification, so the entry is what changed. Found by tools/audit-denotations.pl, which compares every denotation against the vendored appendix."
status: "ok"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "no mode. Swept the 17 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-03 (tools/discover-hashcat.pl --all, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["SHA1SHA1PASS-TRUNC1SALT"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "mdxfind RCS 1.540 (2026/08/22)"
    note: "mdxfind's own published example for this identifier, recovered by mdxfind at this identifier with mdxfind's own published plaintext."
  hashpipe:
    types: ["SHA1SHA1PASS-TRUNC1SALT"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    verified: "absent"
    verified_at: "2026-09-04"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "no format. Swept the 33 format(s) whose own valid() accepts this entry's own vector, as john --show=left reports them, on 2026-09-04 (a tools/discover-john.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. For john the control is also per ENTRY and not only per shape: every format counted above is one whose own loader ACCEPTED this hash, so each was asked this exact question and answered no. A format that cannot parse the hash is not counted at all, and an entry no format can parse is reported as unsearched rather than decided. Every applicable format ran to completion; a format killed at the timeout is counted as untested and withholds this verdict. No john format name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if john gains one, this becomes a mapping."
