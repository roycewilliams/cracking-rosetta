  mdxfind:
    types: ["SHA224"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.545 (2026/08/29)"
    note: "type discovered by round-trip search, not by name. The RAW type was dropped from this mapping on 2026-09-05 because it was never true. mdxfind revision 1.290 (2026-04-09) regressed the RAW family so that every RAW type became numerically identical to its plain sibling at x01 -- upstream's own words in revision 1.549, which restored the correct semantics on 2026-08-30. This row's vector is the PLAIN digest (or a truncation of one), so under the regression it verified as the RAW type as well, and the mapping reached tier `vector` on a coincidence rather than on the algorithm. Measured 2026-09-05 by tmp/binary-diff.pl over all 1294 mdxfind vector claims: this claim reproduces under mdxfind RCS 1.545 and NOT under RCS 1.576. hashpipe settles which is right and it is 1.576 -- its own SHA224 example is exactly sha224 of its plaintext while its SHA224RAW example is a different digest entirely, so RAW and plain differ in the third implementation too. The plain type remains and still verifies against the installed binary; nothing else on this row changes."
  john:
    cpu: ["Raw-SHA224", "dynamic_50"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john's own published example ciphertext for this format, recovered by john under this format. john publishes no plaintext, so the plaintext was found by handing john its own example and a candidate list -- what john recovered IS the plaintext, by construction. dynamic_50 came from sha224 in the 2026-09-01 merge, proven there at tier vector."
  crack:
    supported: false
relations:
  - kind: "duplicate-of"
    entry: "sha224"
    distinction: "none"
    note: "merged 2026-09-01: one computation under two names, proven by john's dynamic compiler against both vectors. Royce chose the john-named row on 2026-09-01: raw-sha224 is john's own Raw-SHA224 spelling, and dynamic_50 now sits beside it so a reader arriving by either name lands here"
  - kind: "iterates"
    entry: "sha224-x2"
    distinction: "iteration"
    note: "Both rows name mdxfind type SHA224; this one at -i 2 and raw-sha224 at -i 1. The iteration suffix is part of the identity (MD5x02 is john's dynamic_2, MD5x03 its dynamic_3), so these are two algorithms and not two names. Edge written 2026-09-07 from the data: same type, different iterations: is what `iterates` means, and no judgment was involved."
