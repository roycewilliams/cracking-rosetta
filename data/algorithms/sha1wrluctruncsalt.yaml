id: "sha1wrluctruncsalt"
name: "SHA1WRLUCTRUNCSALT"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type SHA1WRLUCTRUNCSALT (e672) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "sha1(cut(upper(wrl(pass)), 0, N) . salt)"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type SHA1WRLUCTRUNCSALT (e672), which states sha1(cut(upper(wrl(pass)), 0, N) . salt) (N = 21-128). This is what the type emits, not a single construction -- see expression_proof."
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "no mode. Swept the 17 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-03 (tools/discover-hashcat.pl --all, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["SHA1WRLUCTRUNCSALT"]
    verified: "vector"
    verified_at: "2026-09-15"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["SHA1WRLUCTRUNCSALT"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e672 SHA1WRLUCTRUNCSALT, verified with hashpipe -c against the CORRECTED vector -- a per-line pin with no detection, at -t 1, with stdout and stderr kept apart and the emitted label compared against the one asked for. That last precaution is what found the defect this row carried: hashpipe writes an unresolved line to stderr UNCHANGED, so a refusal printed on a shared terminal is character-for-character the input and reads as a pass. Under the previous vector this type refused, and so did mdxfind."
  john:
    verified: "absent"
    verified_at: "2026-09-04"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "no format. Swept the 34 format(s) whose own valid() accepts this entry's own vector, as john --show=left reports them, on 2026-09-04 (a tools/discover-john.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. For john the control is also per ENTRY and not only per shape: every format counted above is one whose own loader ACCEPTED this hash, so each was asked this exact question and answered no. A format that cannot parse the hash is not counted at all, and an entry no format can parse is reported as unsearched rather than decided. Every applicable format ran to completion; a format killed at the timeout is counted as untested and withholds this verdict. No john format name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if john gains one, this becomes a mapping."
  crack:
    supported: false
vectors:
  - hash: "18e34151169d78716359709e30233f238e5e9a54:1122334455667788 128"
    pass: "password123"
    source: "mdxfind"
    form: "native"
    reads_in: ["mdxfind"]
notes: "The vector recorded here until 2026-09-05 was STALE and no longer reproduced by anything: mdxfind answered None found, sorry! and hashpipe refused it. It was not a wrong mapping but an out-of-date digest. mdxfind's own change log records the cause -- e672 shared the lowercase sha1_truncsalt path with e683 and e739, so despite its UC name and its hx.8 definition it emitted a LOWERCASE whirlpool hex digest, and the fix was to uppercase it, verified upstream 108/108 against sha1(cut(upper(wrl(pass)),0,N).salt). The stored string was the pre-fix value. It is replaced with the digest mdxfind RCS 1.576 now emits for the same salt and the same N, generated with -z and re-measured under both tools, so the row again names something that exists. N=128 is the full width of whirlpool's hex, the case where the truncation is the identity; the salt field carries the literal salt and then N, separated by a space. This is a different defect from the twelve sibling TRUNC rows corrected alongside it: theirs were stored as 32-character prefixes of a live digest, while this one was a full-length digest of a superseded algorithm. A vector can go stale when the TOOL is corrected, and nothing in this repository re-checks that on its own."
