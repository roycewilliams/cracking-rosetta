id: "diskcryptor"
name: "DiskCryptor"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "john publishes this as \"DiskCryptor\" and no category, so what kind of construction it is has not been established here. Its name is not expression-shaped and john's dynamic EXPRESSION language cannot be handed it, so there is no expression on this row. That says nothing about whether any tool can CRACK it, and it is not a claim that the algorithm HAS no expression -- run seed-hx.pl and derive-expressions.pl, which can settle that from evidence."
denotation:
  text: "DiskCryptor"
  source: "john"
  note: "john's own label for diskcryptor, in 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200."
status: "ok"
tools:
  hashcat:
    modes: [20011, 20012, 20013]
    verified: "vector"
    verified_at: "2026-09-15"
    verified_with: "hashcat v7.1.2-684-g150a0e61a"
    note: "mode discovered by round-trip search, not by name"
  mdxfind:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "mdxfind RCS 1.545 (2026/08/29)"
    note: "no type. Swept all 1002 mdxfind types on 2026-09-03 (a tools/discover-mdxfind.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable type ran to completion; a type killed at the timeout is counted as untested and withholds this verdict. No mdxfind type name matches any identifier this entry publishes either, normalized by the separator-drift rule. Corroborated by hashpipe, a second binary built from the same catalog: handed this entry's own hash and plaintext it names no type at all. It is the more direct instrument -- it recomputes rather than cracking -- and on this corpus it named a type for 58 entries the sweep alone called silent. This is the absence of an IDENTIFIER, not of the algorithm: if mdxfind gains one, this becomes a mapping."
  john:
    cpu: ["diskcryptor"]
    gpu: ["diskcryptor-aes-opencl"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "Round-tripped here on 2026-09-01, under both diskcryptor and diskcryptor-aes-opencl, against both vectors this entry carries. It had been tier upstream with a note blaming the ~819 candidate plaintexts harvested from john's source for not containing the answer; that diagnosis was wrong. john --list=format-details truncates example_ciphertext at 896 characters, so the header being attacked was never a loadable hash and no wordlist could have cracked it. The vectors here come from john's own src/diskcryptor_common_plug.c test array. Only the two AES-XTS vectors are carried, so the AES-only GPU build round-trips every one of them; john's CPU format also reads the Twofish and Serpent examples. GPU build diskcryptor-aes-opencl has no CPU format of that name, so discover-john.pl --mirror-gpu could not place it; tools/probe-gpu.pl proved it."
  crack:
    supported: false
vectors:
  - hash: "$diskcryptor$0*"
    pass: "openwall"
    source: "john"
    reads_in: ["john"]
  - hash: "$diskcryptor$0*"
    pass: "openwall123"
    source: "john"
    reads_in: ["john"]
notes: "Vector(s) added 2026-09-01 from john's own src test data, because john --list=format-details truncates example_ciphertext at 896 characters and every container example is longer than that. The plaintext is john's finding, not the source's claim: each hash was cracked under the CPU format this entry names and under the GPU build that has no CPU twin, and both recovered the plaintext recorded here."
