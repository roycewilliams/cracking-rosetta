    distinction: "application"
    note: "Both rows are one computation, and each exists because a tool publishes a separate identifier for it: hashcat 15000 \"FileZilla Server >= 0.9.55\" against hashcat 1710 \"sha512($pass.$salt)\". PROVEN RATHER THAN INFERRED, 2026-09-08: mdxfind pinned to ^SHA512PASSSALT$ reproduced every member of this cluster from its OWN stored vector, against the local build RCS 1.579. A shared type name alone would not have established it -- mdxfind's EPISERVER reproduces a SHA-1 row and a SHA-256 row because the string carries a variant tag it dispatches on -- so the second control is that every digest in this cluster is 128 characters wide, which leaves the type no variant field to have read."
