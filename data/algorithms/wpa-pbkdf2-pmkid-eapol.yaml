id: "wpa-pbkdf2-pmkid-eapol"
name: "WPA-PBKDF2-PMKID+EAPOL"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat 22000 is a container or application format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "WPA-PBKDF2-PMKID+EAPOL"
  source: "hashcat"
  note: "hashcat's own label for 22000, category \"Network Protocol\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "protocol"
status: "needs-review"
tools:
  hashcat:
    modes: [22000]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "Round-tripped, but attributed by a SOLO run, because hashcat echoed a different spelling of this hash than it was given under mode(s) 22000, and the grouped run attributes a crack by matching the hash string -- its output lines do not correspond to its input lines -- so it could not credit one. One hash and one candidate per invocation leaves nothing else the crack could belong to. The stored vector is unchanged and is the form hashcat was fed."
  mdxfind:
    types: ["WPA-PMKID"]
    verified: "vector"
    verified_at: "2026-09-04"
    verified_with: "mdxfind RCS 1.545 (2026/08/29)"
    note: "type discovered by round-trip search, not by name"
  crack:
    supported: false
relations:
  - kind: "covers"
    entry: "wpa-eapol"
    distinction: "naming"
    note: "hashcat 22000 \"WPA-PBKDF2-PMKID+EAPOL\" accepts EITHER artifact -- a PMKID or an EAPOL handshake -- where wpa-eapol carries one of the two. So this is NOT same-computation: for a given input the two agree exactly, and the covering identifier additionally accepts inputs the other does not. hashcat's own mode name states the union, so unlike a row that overstates its own scope, this row names its identifier faithfully and no merge is owed. 'covers' was added to the vocabulary on 2026-09-08 for exactly this, decided by Royce: same-computation overstates it and collides-on-subset means the opposite thing. Measured 2026-09-08, not read off the two names. The corpus holds three WPA serializations, one per generation of tooling -- hashcat's hccapx (2500/2501), its pmkid line (16800/16801) and the WPA*NN* form -- and no sweep had ever related these rows because each tool is silent about another tool's spelling, which is not evidence. tmp/wpa-canon.pl converts all three to WPA*NN*, checking hccapx's HCPX magic first because every field after it is positional. 2500 and 2501 turn out to carry the IDENTICAL blob, and 16800/16801 the identical PMKID and MACs: each pair is one credential asked two ways. Every claim here is a round trip against hashcat v7.1.2-606 and mdxfind RCS 1.579, each with a WRONGCANDIDATE control that found nothing."
