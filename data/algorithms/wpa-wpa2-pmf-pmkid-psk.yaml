notes: "NO hashcat BLOCK, and that is a decision rather than a measurement. The transcribed WPA*02* line in data/mdxfind-transcodes.tsv, which is what gives this row its mdxfind mapping, is ALSO reproduced by hashcat -m 22000: measured 2026-09-07 on v7.1.2-606-ge2a7ab834, reading --outfile rather than stdout, with a WRONGCANDIDATE control that left the outfile empty. It is not recorded as a mapping because the concession could not be declared: tools.<tool>.match allows 'hash-transcoded' on mdxfind only, on the ground that only mdxfind has a transcode file, so a hashcat block earned this way would sit at tier 'vector' looking byte-exact -- which is the silence that field exists to end. Royce decided 2026-09-07 to leave the scoping as it is and record the reason here. If hashcat ever gains a transcode file, this becomes a mapping and needs no new measurement."
