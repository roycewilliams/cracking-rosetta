id: "md5ucbase64sha1raw"
name: "MD5UCBASE64SHA1RAW"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type MD5UCBASE64SHA1RAW (e376) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "md5_uc(base64(sha1_bin(pass)))"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type MD5UCBASE64SHA1RAW (e376), which states md5_uc(base64(sha1_bin(pass))) (Note [24]). This is what the type emits, not a single construction -- see expression_proof."
status: "ok"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["MD5UCBASE64SHA1RAW"]
    verified: "vector"
    verified_at: "2026-08-30"
    verified_with: "mdxfind"
  crack:
    supported: false
vectors:
  - hash: "c20983cb4198e300ba28a9423660a9c9"
    pass: "password123"
    source: "mdxfind"
notes: "The vendored catalog renders this type's example digest in uppercase hex, and mdxfind will not read it back in that case, so the seeding pass could not verify it. mdxfind -z computes the same digest in lowercase for the same plaintext, and pinned to ^MD5UCBASE64SHA1RAW$ it reproduces that form; the stored vector is the catalog's own digest re-cased, not one we invented. Fourteen other types carry an uppercase example (MD5UC, SHA1UC, SHA256UC, RACF, ORACLE7 among them) and are NOT all the same story -- MD5UC and SHA256UC do not reproduce in either case."
