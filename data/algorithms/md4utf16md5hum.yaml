notes: "Created 2026-09-05. mdxfind e575 had no row here: it is one of the types that were in the inventory but in no queue, because GAPS.md carried an orphan-identifier section for hashcat only. The salt on the vector contains spaces, which is legal and is why the whole mdxfind-readable string is the hash field."
