id: "mozilla-key4-db"
name: "Mozilla key4.db"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat mode 26100 is a Password Manager format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "Mozilla key4.db"
  source: "hashcat"
  note: "hashcat's own label for mode 26100, category \"Password Manager\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "application"
status: "ok"
tools:
