id: "md5dsalt"
name: "MD5DSALT"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "Withdrawn 2026-08-31. This entry carried the expression \"md5(md5(md5($p).$s).salt2)\", transcribed from the hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A entry for mdxfind type MD5DSALT (e408) by a parser that has since been corrected: it carries the bare operand salt2, which john's dynamic language cannot bind. Nothing can compile that string, so it was a claim rather than a fact, and it is withdrawn rather than adjusted -- guessing what upstream meant is exactly what the expression field exists to stop. Re-run seed-hx.pl and denote-hx.pl to settle this entry from the corrected parse."
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-15"
    verified_with: "hashcat v7.1.2-684-g150a0e61a"
    note: "no mode. Swept the 27 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-15 (a tools/discover-hashcat.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["MD5DSALT"]
    verified: "asserted"
  hashpipe:
    types: ["MD5DSALT"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e408 MD5DSALT. verified with hashpipe -c, which pins each line to its own leading TYPE label and runs no detection, at -t 1 and with the emitted label compared against the one asked for. Both precautions matter on this build: -m does not restrict what a recognised wrapper reaches, and results vary with the thread count. No iterations: is recorded from hashpipe -- the suffixes are different quantities and this repository follows mdxfind for that field."
  crack:
    supported: false
vectors:
  - hash: "4e8d3e56d0159708bced73cfad02555f:7aG7aG"
    pass: "password123"
    source: "hashpipe"
notes: "The vector is hashpipe's published example, verified under hashpipe -c pinned to MD5DSALT, and mdxfind will not read it back, so the mdxfind mapping stays at tier `asserted`. Measured 2026-09-04: pinned with -h '^MD5DSALT$', mdxfind performs ZERO hash calculations on the line under -f and zero under -F, at every iteration count tried, so it is declining the input shape rather than computing and missing. hashpipe's verify_md5dsalt parses the line as a 32-hex digest, a colon, and a salt of 2 to 6 characters, then sweeps the ways that salt can be split -- this is one of the multi-emit DSALT types CLAUDE.md records, which is why no single expression belongs on this row either."
