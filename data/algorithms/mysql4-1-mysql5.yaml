notes: "Two corrections 2026-09-06, both measured. dynamic_1028 was REMOVED: it computes sha1(sha1_raw($p)) CUT TO 32 hex characters -- no leading star and no upper-casing, so it is not MySQL5 at all -- and it now has its own row, sha1raw-substr-0-32, under the construction it actually computes. The vector 06c0bf5b64ece2f648b5f048a7190390 / test1 went with it: it is john's own published Test= line for dynamic_1028, harvested onto this row because this row named that format, and it is 32 hex characters where a MySQL5 hash is a star and 40. Vector 'john' added in its place: the SAME credential as this row's first vector, re-serialized into the form john's mysql-sha1 reads. It is not independent evidence -- do not read two agreeing vectors here as corroboration. mdxfind's SQL5 emits the bare lower-case digest this row already stored; john wants a leading star and UPPER-case hex, the shape of its own published example. Handed the bare string, mysql-sha1 answers \"No password hashes loaded\". The re-encoding was not assumed: the starred string was handed to john with only the plaintext the stored vector already states, and fell."
