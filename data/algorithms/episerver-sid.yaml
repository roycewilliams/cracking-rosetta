    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.576 (2026/09/02)"
    note: "mdxfind e1014 EPISERVER-SID, reached by rewriting this row's vector into mdxfind's serialization: john writes 0x<SID> 0x<digest> space separated with the SID first; mdxfind reads <digest>:<SID>. WITHDRAWN 2026-09-05 and kept below, because this repository published it. That sweep ran against mdxfind RCS 1.545 with 1002 types and could only ever have offered it the john-form string; the inventory here is now RCS 1.576 with 1027. Superseded note follows. || no type. Swept all 1002 mdxfind types on 2026-09-03 (a tools/discover-mdxfind.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable type ran to completion; a type killed at the timeout is counted as untested and withholds this verdict. No mdxfind type name matches any identifier this entry publishes either, normalized by the separator-drift rule. Corroborated by hashpipe, a second binary built from the same catalog: handed this entry's own hash and plaintext it names no type at all. It is the more direct instrument -- it recomputes rather than cracking -- and on this corpus it named a type for 58 entries the sweep alone called silent. This is the absence of an IDENTIFIER, not of the algorithm: if mdxfind gains one, this becomes a mapping."
