id: "episerver-sid"
name: "EPiServer SID"
expression: "sha1(cut(fromhex($s),0,29).$p.$c1),c1=\\x00"
expression_proof:
  verified: "upstream"
  verified_at: "2026-09-27"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type EPISERVER-SID (e1014), which states sha1(cut(fromhex(salt), 0, 29) . pass . fromhex(\"00\")) (EPiServer tblSID). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it. An independent Digest:: computation of this string DOES reproduce this entry's own vector, checked 2026-09-27. Superseded the denotation \"EPiServer SID\" (source: john), which validate.pl forbids alongside an expression."
status: "ok"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-15"
    verified_with: "hashcat v7.1.2-684-g150a0e61a"
    note: "no mode. Swept the 17 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-15 (a tools/discover-hashcat.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["EPISERVER-SID"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.576 (2026/09/02)"
  hashpipe:
    types: ["EPISERVER-SID"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e1014 EPISERVER-SID. verified with hashpipe -c, which pins each line to its own leading TYPE label and runs no detection, at -t 1 and with the emitted label compared against the one asked for. Both precautions matter on this build: -m does not restrict what a recognised wrapper reaches, and results vary with the thread count. No iterations: is recorded from hashpipe -- the suffixes are different quantities and this repository follows mdxfind for that field."
  john:
    cpu: ["EPI"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john's own published example ciphertext for this format, recovered by john under this format. john publishes no plaintext, so the plaintext was found by handing john its own example and a candidate list -- what john recovered IS the plaintext, by construction."
  crack:
    supported: false
vectors:
  - hash: "0x5F1D84A6DE97E2BEFB637A3CB5318AFEF0750B856CF1836BD1D4470175BE 0x4D5EFDFA143EDF74193076F174AC47CEBF2F417F"
    pass: "Abc.!23"
    source: "john"
    form: "john"
    reads_in: ["john"]
    credential: "episerver-sid"
  - hash: "4D5EFDFA143EDF74193076F174AC47CEBF2F417F:5F1D84A6DE97E2BEFB637A3CB5318AFEF0750B856CF1836BD1D4470175BE"
    pass: "Abc.!23"
    source: "mdxfind"
    form: "mdxfind"
    reads_in: ["mdxfind"]
    credential: "episerver-sid"
notes: "The two vectors on this row are ONE credential written twice and must never be read as corroborating each other. john writes 0x<SID> 0x<digest> space separated with the SID first; mdxfind reads <digest>:<SID>. The re-encoding was proven rather than assumed: mdxfind pinned to EPISERVER-SID recovers this row's own stated plaintext from the rewritten string, and the field-swapped control does not crack, so the field order is measured and not guessed."
