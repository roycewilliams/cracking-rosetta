id: "hmac-sha1"
name: "HMAC-SHA1"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "john publishes this as \"HMAC-SHA1\" and no category, so what kind of construction it is has not been established here. Its name is not expression-shaped and john's dynamic EXPRESSION language cannot be handed it, so there is no expression on this row. That says nothing about whether any tool can CRACK it, and it is not a claim that the algorithm HAS no expression -- run seed-hx.pl and derive-expressions.pl, which can settle that from evidence."
denotation:
  text: "HMAC-SHA1"
  source: "john"
  note: "john's own label for HMAC-SHA1, in 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200."
status: "ok"
tools:
  hashcat:
    modes: [150]
    verified: "vector"
    verified_at: "2026-09-15"
    verified_with: "hashcat v7.1.2-684-g150a0e61a"
    note: "mode discovered by round-trip search, not by name"
  mdxfind:
    types: ["HMAC-SHA1-KPASS"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.576 (2026/09/02)"
    note: "mdxfind e793 HMAC-SHA1-KPASS. Added 2026-09-05. This row read as though john were doing something no other tool does, and it is not: The same NAME means opposite things in john and mdxfind, which is what put this mapping on the wrong row. john's HMAC-* formats key on the PASSWORD -- john's own source says so, ALGORITHM_NAME is literally \"password is key\" in hmacMD5_fmt_plug.c, hmacSHA1_fmt_plug.c, hmacSHA256_fmt_plug.c and hmacSHA512_fmt_plug.c. mdxfind splits the two cases across two names: hx Appendix A gives HMAC-SHA1 (e215) as hmac_sha1(pass, user), keyed on the USER, and HMAC-SHA1-KPASS (e793) as hmac_sha1(salt, pass), keyed on the PASSWORD. So john's HMAC-SHA1 is mdxfind's HMAC-SHA1-KPASS, and matching the two by name pairs each with the wrong one. Measured -- mdxfind pinned to HMAC-SHA1-KPASS recovers this row's own plaintext, and pinned to the same-named non-KPASS type it correctly refuses, which is the control that says the two are different computations rather than two spellings."
  john:
    cpu: ["HMAC-SHA1"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john's own published example ciphertext for this format, recovered by john under this format. john publishes no plaintext, so the plaintext was found by handing john its own example and a candidate list -- what john recovered IS the plaintext, by construction."
  crack:
    supported: false
relations:
  - kind: "same-computation"
    entry: "hmac-sha1-kpass"
    distinction: "naming"
    note: "Measured 2026-09-04: this row and hmac-sha1-kpass are one computation under three names. john publishes the format HMAC-SHA1, hashcat publishes mode 150 \"HMAC-SHA1 (key = $pass)\" and mdxfind publishes the type HMAC-SHA1-KPASS, and mdxfind pinned to HMAC-SHA1-KPASS reproduces BOTH rows vectors -- this rows RFC 2202 vector once it is written in mdxfinds serialization (<digest>:<message>, plaintext = the key), and the other rows own vector, which already stands at tier vector. Note what the plain name does NOT mean: mdxfinds HMAC-SHA1 without the -KPASS suffix keys on the SALT and is already mapped to hmac-sha1-plain-salt (hashcat 160). The name match absence.pl reported for this row pointed at that type and was wrong."
vectors:
  - hash: "The quick brown fox jumps over the lazy dog#de7c9b85b8b78aa6bc8a7a36f70a90701c9db4d9"
    pass: "key"
    source: "john"
    form: "john"
    reads_in: ["john"]
    credential: "hmac-sha1"
  - hash: "de7c9b85b8b78aa6bc8a7a36f70a90701c9db4d9:The quick brown fox jumps over the lazy dog"
    pass: "key"
    source: "mdxfind"
    form: "mdxfind"
    reads_in: ["mdxfind"]
    credential: "hmac-sha1"
notes: "The two vectors on this row are ONE credential written twice and must never be read as corroborating each other: john reads <message>#<digest>, mdxfind reads <digest>:<salt>. The same NAME means opposite things in john and mdxfind, which is what put this mapping on the wrong row. john's HMAC-* formats key on the PASSWORD -- john's own source says so, ALGORITHM_NAME is literally \"password is key\" in hmacMD5_fmt_plug.c, hmacSHA1_fmt_plug.c, hmacSHA256_fmt_plug.c and hmacSHA512_fmt_plug.c. mdxfind splits the two cases across two names: hx Appendix A gives HMAC-SHA1 (e215) as hmac_sha1(pass, user), keyed on the USER, and HMAC-SHA1-KPASS (e793) as hmac_sha1(salt, pass), keyed on the PASSWORD. So john's HMAC-SHA1 is mdxfind's HMAC-SHA1-KPASS, and matching the two by name pairs each with the wrong one."
