id: "sha1uc"
name: "SHA1UC"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "the construction upstream states for mdxfind type SHA1UC (e182) names sha1_uc(), which john's dynamic EXPRESSION vocabulary does not have -- checked against the function names appearing in john's own --list=subformats, so this is a lookup and not an opinion. It says nothing about whether john can CRACK this: john has formats for plenty of these constructions, and where it does they are in tools.john.cpu. The wording upstream uses is kept in denotation:."
denotation:
  text: "sha1_uc(pass)"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type SHA1UC (e182), which states sha1_uc(pass)."
status: "needs-review"
tools:
  hashcat:
    modes: [100]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "proven three ways because -m 100 alone is not enough: hashcat cracked this row's own vector under mode 100, john's Raw-SHA1 and dynamic_26 cracked it too with a FULL digest comparison, and Digest::SHA confirms sha1(\"password123\") is cbfdac6008f9cab4083784cbd1874f76618d2a97 character for character. The third step is required here: measured 2026-08-31, hashcat -m 100 skips hash positions 0-7, so on its own it cannot tell this row from sha1lsb35, which is the same digest with those nibbles masked. discover-hashcat.pl's canary withheld the claim for exactly that reason; this is a human overriding it with the independent recomputation, not the tool's word."
  mdxfind:
    types: ["SHA1UC"]
    verified: "upstream"
    verified_at: "2026-08-31"
    verified_with: "mdxfind RCS 1.540 (2026/08/22)"
    note: "NOT REPRODUCED HERE. mdxfind publishes this identifier and a worked example, which is what tier `upstream` means, but the local round-trip FAILED: the tool pinned to this identifier did not reproduce its own published example. The row exists so that someone arriving by this identifier is not met with nothing; the claim is upstream's, not this repository's, until a vector is round-tripped here. Re-run seed-orphans.pl --tool mdxfind --only SHA1UC to retry."
  john:
    cpu: ["Raw-SHA1", "dynamic_26"]
    gpu: ["raw-SHA1-opencl"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "john"
    note: "format discovered by round-trip search, not by name. Raw-SHA1-Linkedin was recorded here by discover-john.pl on 2026-08-31 and WITHDRAWN the same day. It is john's format for the LinkedIn leak, whose hashes have their leading nibbles zeroed, and it ignores hash positions 0-4 -- the 20 bits that leak zeroed -- measured position by position on 2026-09-01. That is the same defect the hashcat canary found in -m 100, at a different width: -m 100 skips 0-7. It therefore cracks any full SHA-1 digest as well, which is a collision and not a denotation. Raw-SHA1 and dynamic_26 both compare the whole digest and were re-checked position by position."
  crack:
    supported: false
relations:
  - kind: "collides-on-subset"
    entry: "sha1lsb35"
    distinction: "truncation"
    note: "SHA1UC is SHA-1 written in uppercase hex and SHA1lsb35 is SHA-1 with the leading nibbles masked to zero, so a tool that skips that field cannot tell them apart: hashcat -m 100 skips hash positions 0-7 and john Raw-SHA1-Linkedin skips 0-4, measured 2026-09-01. SHA1lsb35 masks exactly 5 nibbles, so either blind spot covers the whole difference: the digests are identical from position 5 onward."
vectors:
  - hash: "CBFDAC6008F9CAB4083784CBD1874F76618D2A97"
    pass: "password123"
    source: "mdxfind"
    reads_in: ["john"]
