id: "django-sha-1"
name: "Django (SHA-1)"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat mode 124 is a Framework format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "Django (SHA-1)"
  source: "hashcat"
  note: "hashcat's own label for mode 124, category \"Framework\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "application"
status: "ok"
tools:
  hashcat:
    modes: [124]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "hashcat's own published example hash for this mode, recovered by hashcat at this mode with hashcat's own published plaintext."
  mdxfind:
    types: ["SHA1SALTPASS"]
    verified: "vector"
    verified_at: "2026-09-06"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
    note: "Round-tripped on the TRANSCRIBED form, not on the vector as stored: this entry keeps its vector in another tool's serialization, which mdxfind's reader does not parse. mdxfind pinned with -h reproduced SHA1SALTPASS as \"02d5916550edf7fc8c886f044887f4b1abf9b013:fe76b:hashcat\", from data/mdxfind-transcodes.tsv. The plaintext is one this entry already stores, and the two strings are ONE piece of evidence written twice -- not two agreeing vectors."
  crack:
    supported: false
relations:
  - kind: "same-computation"
    entry: "sha1-salt-pass"
    distinction: "encoding"
    note: "Measured 2026-09-04: the same computation, sha1($salt.$pass), stored two ways. Django writes sha1$<salt>$<digest> and mdxfind reads <digest>:<salt>, and this rows own vector reproduces under mdxfind pinned to SHA1SALTPASS once it is rewritten that way, handed to mdxfind with only the plaintext this row already states. No mdxfind type is named on this row because mdxfind cannot READ Djangos serialization; the type belongs to sha1-salt-pass, which is where a reader holding a bare <digest>:<salt> should land. hashcat tracks the two separately as modes 124 and 120."
vectors:
  - hash: "sha1$fe76b$02d5916550edf7fc8c886f044887f4b1abf9b013"
    pass: "hashcat"
    source: "hashcat"
    reads_in: ["hashcat"]
