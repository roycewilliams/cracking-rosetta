id: "hmac-sha384-johnhmac-sha384"
name: "HMAC-SHA384"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "john publishes this as \"HMAC-SHA384\" and no category, so what kind of construction it is has not been established here. Its name is not expression-shaped and john's dynamic EXPRESSION language cannot be handed it, so there is no expression on this row. That says nothing about whether any tool can CRACK it, and it is not a claim that the algorithm HAS no expression -- run seed-hx.pl and derive-expressions.pl, which can settle that from evidence."
denotation:
  text: "HMAC-SHA384"
  source: "john"
  note: "john's own label for HMAC-SHA384, in 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200."
status: "ok"
tools:
  mdxfind:
    types: ["HMAC-SHA384-KPASS"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.576 (2026/09/02)"
    note: "mdxfind e796 HMAC-SHA384-KPASS. Added 2026-09-05. This row read as though john were doing something no other tool does, and it is not: The same NAME means opposite things in john and mdxfind, which is what put this mapping on the wrong row. john's HMAC-* formats key on the PASSWORD -- john's own source says so, ALGORITHM_NAME is literally \"password is key\" in hmacMD5_fmt_plug.c, hmacSHA1_fmt_plug.c, hmacSHA256_fmt_plug.c and hmacSHA512_fmt_plug.c. mdxfind splits the two cases across two names: hx Appendix A gives HMAC-SHA1 (e215) as hmac_sha1(pass, user), keyed on the USER, and HMAC-SHA1-KPASS (e793) as hmac_sha1(salt, pass), keyed on the PASSWORD. So john's HMAC-SHA1 is mdxfind's HMAC-SHA1-KPASS, and matching the two by name pairs each with the wrong one. Measured -- mdxfind pinned to HMAC-SHA384-KPASS recovers this row's own plaintext, and pinned to the same-named non-KPASS type it correctly refuses, which is the control that says the two are different computations rather than two spellings."
  john:
    cpu: ["HMAC-SHA384"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john's own published example ciphertext for this format, recovered by john under this format. john publishes no plaintext, so the plaintext was found by handing john its own example and a candidate list -- what john recovered IS the plaintext, by construction."
  crack:
    supported: false
relations:
  - kind: "same-computation"
    entry: "hmac-sha384-kpass"
    distinction: "naming"
    note: "Measured 2026-09-04, same as the hmac-sha1 pair: mdxfind pinned to HMAC-SHA384-KPASS reproduces this rows RFC 4231 vector in mdxfinds serialization, and hmac-sha384-kpass already stands at tier vector for the same type."
