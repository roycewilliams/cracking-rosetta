notes: "john has an AxCrypt 2.x format and it is NOT recorded here, because the measurement is ambiguous and a guess would be a false claim either way. Measured 2026-09-01: john --format=axcrypt2-opencl LOADS this entry's vector (\"Loaded 1 password hash ... AxCrypt 2.x [PBKDF2-SHA512 AES OpenCL]\") and then does not recover \"hashcat\" from it, while the same format recovers axcrypt-2-aes-256's vector on the first candidate. That is not a parse failure -- john accepted the hash and rejected the password -- so either john's format does not implement the AES-128 key wrap, or this vector is not what it says. The vector itself is sound: hashcat mode 23500 round-trips it, tier vector. Left open for upstream rather than resolved by picking a side."
