id: "wpa-pmk"
name: "WPA-PMK"
category: "protocol"
status: "needs-review"
tools:
  hashcat:
    modes: [22001]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "Round-tripped, but attributed by a SOLO run, because hashcat echoed a different spelling of this hash than it was given under mode(s) 22001, and the grouped run attributes a crack by matching the hash string -- its output lines do not correspond to its input lines -- so it could not credit one. One hash and one candidate per invocation leaves nothing else the crack could belong to. The stored vector is unchanged and is the form hashcat was fed."
  mdxfind:
    types: ["WPA-PMK"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
    note: "the vector below cracks, but mdxfind cannot GENERATE one: -z emits nothing for this type because a real WPA handshake supplies the ESSID and MAC addresses. A corpus sweep that emits a vector per type will therefore skip WPA-PMK, and that is expected rather than a vector waiting to be filled."
  hashpipe:
    types: ["WPA-PMK"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  crack:
    supported: false
relations:
  - kind: "covers"
    entry: "wpa-eapol-pmk"
    distinction: "naming"
    note: "hashcat 22001 \"WPA-PMK-PMKID+EAPOL\" accepts EITHER artifact -- a PMKID or an EAPOL handshake -- where wpa-eapol-pmk carries one of the two. So this is NOT same-computation: for a given input the two agree exactly, and the covering identifier additionally accepts inputs the other does not. hashcat's own mode name states the union, so unlike a row that overstates its own scope, this row names its identifier faithfully and no merge is owed. 'covers' was added to the vocabulary on 2026-09-08 for exactly this, decided by Royce: same-computation overstates it and collides-on-subset means the opposite thing. Measured 2026-09-08, not read off the two names. The corpus holds three WPA serializations, one per generation of tooling -- hashcat's hccapx (2500/2501), its pmkid line (16800/16801) and the WPA*NN* form -- and no sweep had ever related these rows because each tool is silent about another tool's spelling, which is not evidence. tmp/wpa-canon.pl converts all three to WPA*NN*, checking hccapx's HCPX magic first because every field after it is positional. 2500 and 2501 turn out to carry the IDENTICAL blob, and 16800/16801 the identical PMKID and MACs: each pair is one credential asked two ways. Every claim here is a round trip against hashcat v7.1.2-606 and mdxfind RCS 1.579, each with a WRONGCANDIDATE control that found nothing."
