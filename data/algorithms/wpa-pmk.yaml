id: "wpa-pmk"
name: "WPA-PMK"
category: "protocol"
status: "needs-review"
tools:
  hashcat:
    modes: [22001]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "Round-tripped, but attributed by a SOLO run, because hashcat echoed a different spelling of this hash than it was given under mode(s) 22001, and the grouped run attributes a crack by matching the hash string -- its output lines do not correspond to its input lines -- so it could not credit one. One hash and one candidate per invocation leaves nothing else the crack could belong to. The stored vector is unchanged and is the form hashcat was fed."
  mdxfind:
    types: ["WPA-PMK"]
    verified: "vector"
    verified_at: "2026-08-29"
    verified_with: "mdxfind"
    note: "the vector below cracks, but mdxfind cannot GENERATE one: -z emits nothing for this type because a real WPA handshake supplies the ESSID and MAC addresses. A corpus sweep that emits a vector per type will therefore skip WPA-PMK, and that is expected rather than a vector waiting to be filled."
  hashpipe:
    types: ["WPA-PMK"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  crack:
    supported: false
