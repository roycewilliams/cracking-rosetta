id: "sha1sha3-256trunc"
name: "SHA1SHA3-256TRUNC"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type SHA1SHA3-256TRUNC (e710) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "sha1(cut(sha3_256(pass), 0, N))"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type SHA1SHA3-256TRUNC (e710), which states sha1(cut(sha3_256(pass), 0, N)) (N = 21-64). This is what the type emits, not a single construction -- see expression_proof."
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "no mode. Swept the 12 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-03 (tools/discover-hashcat.pl --all, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping. RE-MEASUREMENT OWED, and here is exactly what is owed. This entry's vector changed on 2026-09-05, from a 32-character prefix to the full 40-character digest the type emits, so the sweep described above measured a string this entry no longer carries, and the modes it searched were chosen by parsers reading the old width. The absence is therefore UNVERIFIED rather than wrong. It was not re-measured at the recorded binary because the only hashcat on this host is v6.2.5-609-gc4dfcf48f, older than the v7.1.2-549-g8a15e210b this claim and the inventory both name, and stamping a weaker binary would trade a stale measurement for a worse one. What WAS run on 2026-09-05, against the corrected vector, is a full v6.2.5 sweep of the 553 modes that binary could run against it -- 39 were skipped for having no plaintext of an acceptable length -- and not one matched. That corroborates the absence without replacing it: it is the same answer from an older binary, so it cannot speak for the modes v7.1.2 added."
  mdxfind:
    types: ["SHA1SHA3-256TRUNC"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["SHA1SHA3-256TRUNC"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e710 SHA1SHA3-256TRUNC. Verified with hashpipe -c, which pins each line to its own leading TYPE label and runs no detection, at -t 1 and with the emitted label compared against the one asked for. Both precautions matter on this build: -m does not restrict what a recognised wrapper reaches, and results vary with the thread count. This type had no column here until 2026-09-05 not because hashpipe could not verify it but because the vector it was offered was stored at 32 characters; hashpipe compares the whole digest and correctly refused. No iterations: is recorded from hashpipe -- the suffixes are different quantities and this repository follows mdxfind for that field."
  john:
    verified: "absent"
    verified_at: "2026-09-05"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "no format. This entry's vector was corrected on 2026-09-05 -- it had been stored as a 32-character prefix of the 40-character digest this type emits -- which retired the sweep previously recorded here, because that one measured a different string and the set of formats whose valid() accepts a 32-character hash is not the set that accepts a 40-character one. It was re-measured against the restored vector the same day, and NOT by the narrower method: every one of the 957 formats this build registers was run, not only those whose parser accepts the hash, so no format is excluded by a loader's opinion of the string. None reproduced this entry's plaintext and none timed out, so no format is counted as untested. No john format name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if john gains one, this becomes a mapping."
  crack:
    supported: false
vectors:
  - hash: "3a1f71639a8dc528b489817cd26225e9ce875524:64"
    pass: "password123"
    source: "mdxfind"
    form: "native"
    reads_in: ["mdxfind"]
notes: "The vector is in mdxfind's native form: a 40-character sha1 digest, then a colon, then the truncation length N that produced it. mdxfind sweeps N from the inner digest's hex width down to 21, hashing both the leading and the trailing N characters, and reports the N that matched in the salt field; N=64 here is the full width, the case where the truncation is the identity. Until 2026-09-05 this row stored only the leading 32 characters of that digest. mdxfind reported a clean match anyway, because it converts loaded hashes to binary and compares at the shortest length it read, so a prefix verifies and the row looked proven -- while hashpipe, which compares the whole digest, refused it, which is why this row had no hashpipe column. The digest was restored from mdxfind -z, the authority's own generated output, and re-measured under both tools; the string previously stored is its first 32 characters, so this is the same hash the row always named. Twelve TRUNC rows were stored the same way and were corrected together. The thirteenth, sha1sha1trunc, is NOT corrected but extended, because there the 32-character string is john's own serialization rather than a truncation of this repository's making."
