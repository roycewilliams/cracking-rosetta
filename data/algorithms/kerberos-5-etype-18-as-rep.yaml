id: "kerberos-5-etype-18-as-rep"
name: "Kerberos 5, etype 18, AS-REP"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat mode 32200 is a Network Protocol format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "Kerberos 5, etype 18, AS-REP"
  source: "hashcat"
  note: "hashcat's own label for mode 32200, category \"Network Protocol\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "protocol"
status: "ok"
tools:
  hashcat:
    modes: [32200]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "hashcat's own published example hash for this mode, recovered by hashcat at this mode with hashcat's own published plaintext."
  mdxfind:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "mdxfind RCS 1.545 (2026/08/29)"
    note: "no type. Swept all 1002 mdxfind types on 2026-09-03 (a tools/discover-mdxfind.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable type ran to completion; a type killed at the timeout is counted as untested and withholds this verdict. No mdxfind type name matches any identifier this entry publishes either, normalized by the separator-drift rule. Corroborated by hashpipe, a second binary built from the same catalog: handed this entry's own hash and plaintext it names no type at all. It is the more direct instrument -- it recomputes rather than cracking -- and on this corpus it named a type for 58 entries the sweep alone called silent. This is the absence of an IDENTIFIER, not of the algorithm: if mdxfind gains one, this becomes a mapping."
  john:
    cpu: ["krb5asrep"]
    gpu: ["krb5asrep-aes-opencl"]
    verified: "vector"
    verified_at: "2026-09-01"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a"
    note: "GPU build(s) krb5asrep-aes-opencl proven on 2026-09-01 by cracking this entry's own vector(s) under that exact format; john ships no CPU format of that name, so discover-john.pl --mirror-gpu could not place them. CPU format krb5asrep added the same day and on the same evidence: it loads and cracks the transcoded vector too. john covers etypes 17, 18 and 23 under this one identifier, which is why kerberos-5-as-rep-etype-17-18-23 names it as well."
  crack:
    supported: false
vectors:
  - hash: "$krb5asrep$18$user$EXAMPLE.COM$aa4c494f520b27873a4de8f7$"
    pass: "hashcat"
    source: "hashcat"
    form: "hashcat"
    reads_in: ["hashcat"]
    credential: 1
  - hash: "$krb5asrep$18$EXAMPLE.COMuser$$aa4c494f520b27873a4de8f7"
    pass: "hashcat"
    source: "john"
    form: "john"
    reads_in: ["john"]
    credential: 1
notes: "Vector(s) 'hashcat' added 2026-09-01: the SAME Kerberos 5 AS-REP credential(s) already above, re-serialized into the form john reads. They are not independent evidence -- do not read two agreeing vectors here as corroboration. hashcat writes $krb5asrep$<et>$<user>$<REALM>$<checksum>$<data>; john writes $krb5asrep$<et>$<REALM><user>$<data>$<checksum>. The re-encoding was not assumed: each transcoded string was handed to john with only the plaintext the hashcat vector already states, and fell under both the CPU format and the GPU build."
