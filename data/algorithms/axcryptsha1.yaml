id: "axcryptsha1"
name: "AXCRYPTSHA1"
expression: "cut(sha1($p),0,32)"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type AXCRYPTSHA1 (e916), which states cut(sha1(pass), 0, 32). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it.; TRIAGE 2026-09-04 [native-serialization]: no john format, and RosettaExpr can compute this expression but none of the entry's 1 vector(s) is a bare digest to compare it against -- each is in a tool's own serialization, or lacks a salt the expression needs. The expression is unchecked, not contradicted"
category: "application"
status: "needs-review"
tools:
  hashcat:
    modes: [13300]
    verified: "vector"
    verified_at: "2026-08-29"
    verified_with: "hashcat"
  mdxfind:
    types: ["AXCRYPTSHA1"]
    verified: "vector"
    verified_at: "2026-08-29"
    verified_with: "mdxfind"
  hashpipe:
    types: ["AXCRYPTSHA1"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  crack:
    supported: false
relations:
  - kind: "same-computation"
    entry: "sha1-substr-0-32"
    distinction: "encoding"
    note: "Both compute cut(sha1(pass),0,32); mdxfind hx VM reproduces each row own vector from that one string, 2026-09-02. They stay separate rows because the ciphertext SERIALIZATION differs: AxCrypt stores it behind a $axcrypt_sha1$ prefix and hashcat gives that its own mode 13300, where this row stores the bare 32 hex characters. Same computation, two encodings, two identifiers a reader can arrive by."
vectors:
