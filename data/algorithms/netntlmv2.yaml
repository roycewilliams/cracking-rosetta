  john:
    cpu: ["netntlmv2"]
    gpu: ["ntlmv2-opencl"]
    verified: "asserted"
    verified_at: "2026-08-29"
    verified_with: "mdxfind"
    note: "john's own test vector for this format is reproduced by mdxfind pinned to NETNTLMV2 at iteration 1 GPU build(s) ntlmv2-opencl proven on 2026-09-01 by cracking this entry's own vector(s) under that exact format; john ships no CPU format of that name, so discover-john.pl --mirror-gpu could not place them. AMENDED 2026-09-06: both identifiers this block still names have now round-tripped this row own vectors. netlmv2 -- the one that never did, and the reason this block sat at asserted -- has been split off to lmv2-c-r. Measured that day, john pinned to --format=netntlmv2 and handed the vectors NATIVELY, one at a time: it recovers the plaintext of all three vectors still on this row. ntlmv2-opencl was proven the same way on 2026-09-01. What holds this block below tier vector is now ONLY that verify-vectors.pl cannot drive a challenge-response format -- it writes a synthetic login and a TAB before every hash, and this ciphertext embeds its own login -- so a promotion here would be a tier no tool in the repository can re-check. See lmv2-c-r for the same note and the backlog item that closes both."
