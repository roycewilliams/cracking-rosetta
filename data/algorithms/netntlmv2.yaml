  john:
    cpu: ["netntlmv2"]
    gpu: ["ntlmv2-opencl"]
    verified: "vector"
    verified_at: "2026-09-06"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "Round-tripped NATIVELY, one vector per invocation: format(s) netntlmv2 could not parse this entry's vectors under the grouped scheme this tool normally uses, which writes a synthetic login and a TAB before every hash. This ciphertext EMBEDS its own login, so displacing that field is what breaks the parse -- john loaded nothing, which is not the same as cracking nothing, and its own --show summary is what said so. The stored vector is unchanged and is exactly what john was handed. Reproduce it with: john --format=<label> --wordlist=<one candidate> <one hash>, with no --field-separator-char."
  crack:
    supported: false
