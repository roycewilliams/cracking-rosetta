notes: "john reads BOTH tools' NTLMv2 serializations: measured 2026-09-01, netntlmv2 and ntlmv2-opencl load and crack this entry's hashcat-form vectors (USER::DOMAIN:challenge:response:blob) unchanged. An earlier run of this session reported \"No password hashes loaded\" and three re-serialized vectors were briefly added on that basis; the cause was a --field-separator-char=tab passed by the probing tool, which governs how john splits LOGIN from HASH when READING a file, so a tab made john treat each whole line as one login. The vectors were withdrawn and the tool fixed. Kerberos AS-REP is NOT like this: john genuinely cannot read hashcat's $krb5asrep$ field order, which is why those rows do carry a transcoded vector. Two reasons this block is still tier asserted, neither of which is doubt about NETNTLMv2 itself. (1) It names netlmv2, a DIFFERENT computation, and a block carries one tier for every identifier in it; netlmv2 recovers none of these vectors, and the fourth vector (aTest:::...:A1E7281FE8C10E53, an 8-byte blob far short of an NTLMv2 one) looks like the NETLMv2 one. That is a row holding two computations, which CLAUDE.md forbids, and splitting it is curation. (2) verify-vectors.pl cannot check this format at all: it writes a synthetic login and a TAB before each hash, which is right for a hash that is only a digest and wrong here, because a NETNTLMv2 ciphertext EMBEDS its own login (USER::DOMAIN:...) and john will not parse it once that field has been displaced. Measured 2026-09-01: the same vectors load and crack under netntlmv2 and ntlmv2-opencl when handed to john natively, 3 of 4, and verify-vectors.pl reports 0 of 4 for all three identifiers. SPLIT 2026-09-06. netlmv2 and the aTest::: vector moved to their own row, lmv2-c-r. This resolves reason (1) in the paragraph above, which had been recorded here since 2026-09-01 and left to a curator: the row was holding two computations. The split was measured rather than read off the names -- handed to john natively, one vector at a time, netntlmv2 cracks the three vectors still here and REFUSES the aTest one, while netlmv2 cracks the aTest one and refuses these three, each declining to LOAD the other's string. Reason (2) stands unchanged and always will: verify-vectors.pl cannot check a challenge-response format at all, because it displaces the login field this ciphertext embeds, so this block is verified by hand or not at all."
