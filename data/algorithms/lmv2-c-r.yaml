    verified_at: "2026-09-06"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "ROUND-TRIPPED BY HAND, and held at asserted for a reason that is about this repository tooling and not about the mapping. Measured 2026-09-06: john pinned to --format=netlmv2 and handed this row own vector NATIVELY -- no synthetic login, no --field-separator-char -- recovers this row own plaintext on the first try. That is what tier vector means everywhere else. It is not written here because verify-vectors.pl is the promoter and it structurally CANNOT drive this format: it writes a synthetic login and a TAB before every hash, and a NETLMv2 ciphertext EMBEDS its own login, so displacing that field is exactly what breaks the parse. Promoting by hand would put a tier on this row that no tool in the repository can re-check, which is the one thing a tier is supposed to rule out. The fix is a native path in verify-vectors.pl for the challenge-response family -- probe-gpu.pl already has one, but writes only tools.john.gpu -- and it is on the backlog."
