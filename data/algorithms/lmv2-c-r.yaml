notes: "Created 2026-09-06 by splitting netntlmv2, which was holding two computations -- something CLAUDE.md forbids and that row's own notes had already flagged and left to a curator. The split is a measurement, not a reading of the names: handed to john NATIVELY, one vector at a time, netntlmv2 cracks the other three vectors of that row and REFUSES this one, while netlmv2 cracks this one and refuses those three. Each format declines to load the other's string, so the two are not alternative spellings. This vector is john's own published example and is the short one -- an 8-byte blob, far short of an NTLMv2 one, which is what made it visible in the first place. NETLMv2 is john-only: no hashcat mode, mdxfind type or hashpipe type carries the name. NOTE FOR ANYONE VERIFYING THIS ROW: verify-vectors.pl cannot check it. It writes a synthetic login and a TAB before each hash, which is right for a hash that is only a digest and wrong here, because a NETLMv2 ciphertext EMBEDS its own login and john will not parse it once that field has been displaced. Hand it to john natively."
