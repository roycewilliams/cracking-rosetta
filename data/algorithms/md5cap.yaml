id: "md5cap"
name: "MD5CAP"
expression: "md5(cap(md5($p),0))"
expression_proof:
  verified: "upstream"
  verified_at: "2026-09-02"
  verified_with: "mdxfind RCS 1.545 source + binary; hx engine built from that source"
  note: "WITHDRAWN 2026-09-02: this entry read cap(md5($p)), transcribed from the hx specification's Appendix A for mdxfind type MD5CAP (e353). That string is wrong twice over, and Appendix A is wrong about this type in the same way CLAUDE.md already records for e308. mdxfind.c JOB_MD5CAP capitalizes mdbuf[0] ONLY (if (islower(mdbuf[0]))), where hx's bare cap() moves the first lower-case LETTER anywhere; and its loop is for (x = 2; x <= Maxiter; x++) with checkhash INSIDE, so the type never emits a one-iteration value -- mdxfind -i 1 pinned to this type matches nothing. The replacement was established three independent ways, all agreeing on this entry's own vector: the source, the binary reporting it as MD5CAPx02 at -i 2, and hx evaluating md5(cap(md5(pass), 0)). Stays tier upstream because john's dynamic language has no cap() token, so no round-trip can ever promote it. The other twelve cap() entries are NOT affected: five of them carry vectors that discriminate between the two readings and all five match hx's bare cap(), so e353 is an outlier rather than a family error.; TRIAGE 2026-09-05 [corroborated]: no john format, so john ships no control vectors; but RosettaExpr -- an implementation independent of all three crackers -- computes this expression over the entry's own vector(s) and reproduces 1 of 1. That is corroboration, not tier vector, which needs john's own compiler"
