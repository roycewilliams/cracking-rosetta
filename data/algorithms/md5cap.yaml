relations:
  - kind: "collides-on-subset"
    entry: "md5"
    distinction: "encoding"
    note: "MD5CAP is md5(cap(md5($p),0)) and its cap() touches position 0 only, so whenever the inner digest does not START with a lower-case letter the type is byte-identical to two-iteration plain MD5 -- which is how john's dynamic_2 and plain MD5 crack its vector without denoting it. Corrected 2026-09-02 from a note that described hx's bare cap() (first lower-case letter anywhere), a different function that this type does not use."
