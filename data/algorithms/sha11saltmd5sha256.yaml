id: "sha11saltmd5sha256"
name: "SHA11SALTMD5SHA256"
expression_proof:
  verified: "absent"
  verified_at: "2026-09-02"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "Established from mdxfind's own source and a measurement, not from a document: Appendix A writes only the prose \"(complex: iterates over single-char salts)\" for this family and Note [24] does not name it. mdxfind.c sweeps a single salt byte over 9 and 32..126 -- 96 values -- and emits five placements at each (s.d, d.s, s.d.s, s.s.d and d.s.s, where d is the hex inner digest); \"mdxfind -z\" prints 480 candidates per password, which is 5 x 96. Measured 2026-09-02 against RCS 1.545. The name and aliases on this entry are those five placements. mdxfind type SHA11SALTMD5SHA256 (e763) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "SHA11SALTMD5SHA256"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type SHA11SALTMD5SHA256 (e763), which states five-variant single-byte salt search - see Note [10]. This is what the type emits, not a single construction -- see expression_proof."
status: "ok"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-03"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "no mode. Swept the 18 mode(s) whose parser accepts this entry's own vector, as hashcat --identify lists them, on 2026-09-03 (tools/discover-hashcat.pl --all, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable mode ran to completion; a mode killed at the timeout is counted as untested and withholds this verdict. No hashcat mode name matches any identifier this entry publishes either, normalised by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if hashcat gains one, this becomes a mapping."
  mdxfind:
    types: ["SHA11SALTMD5SHA256"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "mdxfind RCS 1.540 (2026/08/22)"
    note: "mdxfind's own published example for this identifier, recovered by mdxfind at this identifier with mdxfind's own published plaintext."
  hashpipe:
    types: ["SHA11SALTMD5SHA256"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  crack:
    supported: false
