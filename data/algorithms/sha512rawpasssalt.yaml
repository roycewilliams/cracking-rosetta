notes: "Created 2026-09-05. Appendix A states the construction as sha512_bin(pass . salt) and glosses it \"BlackBerry ES10 at -i 100\". No denotation: is recorded because that is expressible and a denotation would foreclose it; run tools/derive-expressions.pl. Note what this row is NOT: at depth one it is numerically identical to SHA512PASSSALT (e386), which sha512-pass-salt and filezilla-server-ge-0-9-55 already carry, and the two differ only in ITERATION ROLE -- this one feeds the raw digest back. A corpus sweep will therefore report e1013 on those rows; that is the mask, not a mapping, and ties break to the lower eN."
