    note: "Measured 2026-09-05. At depth one the two are numerically identical -- SHA512RAWPASSSALT (e1013) and SHA512PASSSALT (e386) both compute sha512(pass . salt) -- and they diverge only from depth two, where e1013 feeds the RAW digest back and e386 feeds the hex. So they agree on exactly the depth-one inputs and nowhere else. A corpus-wide mdxfind sweep duly reports e1013 on this row's vector; that is the mask, not a mapping, and the tie breaks to the lower eN."
