id: "sha512rawpasssalt"
name: "SHA512RAWPASSSALT"
status: "needs-review"
tools:
  mdxfind:
    types: ["SHA512RAWPASSSALT"]
    verified: "upstream"
    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.576 (2026/09/02), per the inventory; the installed binary is mdxfind RCS 1.545 (2026/08/29) and does not have this type; hashpipe RCS 1.192 (2026/09/04) reproduced the vector"
    note: "NOT ROUND-TRIPPED BY mdxfind HERE, and that is a fact about this host rather than about the type. SHA512RAWPASSSALT is a type of RCS 1.576 (2026/09/02), and the installed binary is RCS 1.545 (2026/08/29), so pinning it with -h '^SHA512RAWPASSSALT$' selects no type at all. hashpipe -- which shares mdxfind's type list -- was pinned to this exact name with -c and reproduced mdxfind's own published example, emitting it as \"SHA512RAWPASSSALTx01\". That is upstream verified by recomputation, which is what tier `upstream` means. To promote it: install mdxfind RCS 1.576 (2026/09/02) and run seed-orphans.pl --tool mdxfind --only SHA512RAWPASSSALT, then verify-vectors.pl --tool mdxfind."
  crack:
    supported: false
relations:
  - kind: "collides-on-subset"
    entry: "sha512-pass-salt"
    distinction: "iteration"
    note: "Both mdxfind types reproduce BOTH entries' vectors at x01, measured 2026-09-05 with hashpipe -c pinned to each in turn: SHA512RAWPASSSALT and SHA512PASSSALT agree on every input at one iteration, because at depth 1 the only difference between them is whether the digest is emitted as raw bytes or as hex, and the stored form is hex either way. They are NOT the same computation, and depth 2 shows it: SHA512RAWPASSSALTx02 verifies sha512(sha512_raw($p.$s)) = e785d2e3... while SHA512PASSSALTx02 verifies sha512(sha512_hex($p.$s)) = 3de674ce..., for the same password123/DB1C19C0. So this is a coincidence on the x01 subset, which is every input this repository stores, and not an equivalence. It is also why john's dynamic_82 cracks sha512rawpasssalt's vector and is deliberately NOT recorded as a mapping there: per CLAUDE.md, record the trap, not the mapping."
