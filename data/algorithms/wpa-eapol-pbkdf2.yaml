id: "wpa-eapol-pbkdf2"
name: "WPA-EAPOL-PBKDF2"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat 2500 is a container or application format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "WPA-EAPOL-PBKDF2"
  source: "hashcat"
  note: "hashcat's own label for 2500, category \"Network Protocol\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "protocol"
status: "needs-review"
tools:
  hashcat:
    modes: [2500]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "Round-tripped, but attributed by a SOLO run, because under mode(s) 2500 hashcat's parser reads the FILE'S BYTES, and this entry stores the container header as hex because YAML holds text, so the round trip was run against the decoded bytes. The stored hex is unchanged and is what decodes to them; reads_in does NOT list hashcat for it, because hashcat did not read that string. One hash and one candidate per invocation leaves nothing else the crack could belong to. The stored vector is unchanged. Mode(s) 2500 are DEPRECATED in this hashcat and refuse to run at all -- exit 255, nothing attempted -- so the round trip was made with --deprecated-check-disable. That is a statement about what upstream recommends, not about what the plugin computes; reproduce it with that flag."
  crack:
    supported: false
relations:
  - kind: "covered-by"
    entry: "wpa-pbkdf2-pmkid-eapol"
    distinction: "naming"
    note: "hashcat 22000 \"WPA-PBKDF2-PMKID+EAPOL\" accepts EITHER artifact -- a PMKID or an EAPOL handshake -- where wpa-eapol-pbkdf2 carries one of the two. So this is NOT same-computation: for a given input the two agree exactly, and the covering identifier additionally accepts inputs the other does not. hashcat's own mode name states the union, so unlike a row that overstates its own scope, this row names its identifier faithfully and no merge is owed. 'covers' was added to the vocabulary on 2026-09-08 for exactly this, decided by Royce: same-computation overstates it and collides-on-subset means the opposite thing. Measured 2026-09-08, not read off the two names. The corpus holds three WPA serializations, one per generation of tooling -- hashcat's hccapx (2500/2501), its pmkid line (16800/16801) and the WPA*NN* form -- and no sweep had ever related these rows because each tool is silent about another tool's spelling, which is not evidence. tmp/wpa-canon.pl converts all three to WPA*NN*, checking hccapx's HCPX magic first because every field after it is positional. 2500 and 2501 turn out to carry the IDENTICAL blob, and 16800/16801 the identical PMKID and MACs: each pair is one credential asked two ways. Every claim here is a round trip against hashcat v7.1.2-606 and mdxfind RCS 1.579, each with a WRONGCANDIDATE control that found nothing."
  - kind: "same-computation"
    entry: "wpa-eapol"
    distinction: "naming"
    note: "One computation under two tools' names: mdxfind WPA-EAPOL and hashcat 2500 (WPA-EAPOL-PBKDF2). Both rows' own credentials were reproduced by a SINGLE identifier, which is what makes this same-computation rather than a resemblance. Measured 2026-09-08, not read off the two names. The corpus holds three WPA serializations, one per generation of tooling -- hashcat's hccapx (2500/2501), its pmkid line (16800/16801) and the WPA*NN* form -- and no sweep had ever related these rows because each tool is silent about another tool's spelling, which is not evidence. tmp/wpa-canon.pl converts all three to WPA*NN*, checking hccapx's HCPX magic first because every field after it is positional. 2500 and 2501 turn out to carry the IDENTICAL blob, and 16800/16801 the identical PMKID and MACs: each pair is one credential asked two ways. Every claim here is a round trip against hashcat v7.1.2-606 and mdxfind RCS 1.579, each with a WRONGCANDIDATE control that found nothing. One trap is worth carrying: the first EAPOL conversion produced a line nothing would crack, and \"wrong conversion\" and \"these rows differ\" are indistinguishable from that alone. The EAPOL frame's key-info word is 0x0109 -- MIC set, ACK clear -- so the frame is M2 and carries the STA's nonce, and that value equalled the field hccap.h NAMES nonce_ap. The SECOND 32-byte nonce field is the one hashcat's WPA*02* slot wants, in both hccap_t and hccapx_t; the header comments are not a guide. The two rows also store their vectors in different serializations, but that is not WHY both exist: each row is where a reader arrives from a different tool's identifier, which is what distinction 'naming' means."
