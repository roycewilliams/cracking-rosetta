id: "sha1saltcx"
name: "SHA1SALTCX"
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["SHA1SALTCX"]
    verified: "asserted"
  crack:
    supported: false
notes: "This row has NO vector and that is a deliberate withholding, measured 2026-09-04. The only example anyone publishes for this type -- mdxfind's own inventory row and the vendored hashpipe catalog carry the same string -- b59b77c52921e5df0d007fec2518e0f726ce3aaf:administrator:password123, is a TEN-ITERATION hash, and this row declares no iteration count, which the schema reads as one. Both oracles agree and each refuses the wrong depth: hashpipe -c asked for SHA1SALTCXx01 refuses and emits SHA1SALTCXx10 when asked bare, and mdxfind -h '^SHA1SALTCX$' -i 1 finds nothing while -i 10 reproduces the line exactly, as SHA1SALTCXx10. Storing it here would put an x10 digest under an x01 row, which is the defect audit-iterations.pl exists to catch -- the iteration suffix is identity, not a tuning knob. The type does support depth 1 (hashpipe's source notes it verifies at every depth, x01 included); nobody has published a depth-1 example, and one generated locally could not promote mdxfind anyway. So this needs a curator: either a depth-1 vector from upstream, or a decision that this row is about SHA1SALTCXx10 and should say so. Worth reporting upstream: the catalog publishes a depth-10 example with nothing in the row to say the depth is not 1."
