id: "sha1md5hum"
name: "SHA1MD5HUM"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type SHA1MD5HUM (e364) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "emit(sha1(md5^N(pass) . S))"
  source: "mdxfind"
  note: "hx Language Specification, Appendix A, vendored as vendor/cynosureprime/hx.8 at commit 2139193c, entry for mdxfind type SHA1MD5HUM (e364), which states emit(sha1(md5^N(pass) . S)). CORRECTED 2026-09-05: this entry recorded emit(sha1(md5(pass).S)), and the two disagreed about the algorithm. The HUM block re-hashes the inner digest at the end of every iteration -- if (x < Maxniter) { if (len == 32) mymd5(cur, len, md5buf.h); else mysha1(cur, len, md5buf.h); } -- so the value the outer hash consumes is the inner digest applied N times, which is what the exponent in the specification records. The text recorded here described only the N=1 case. mdxfind.c is authoritative and it agrees with the specification, so the entry is what changed. Found by tools/audit-denotations.pl, which compares every denotation against the vendored appendix."
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["SHA1MD5HUM"]
    verified: "vector"
    verified_at: "2026-09-04"
    verified_with: "mdxfind"
  hashpipe:
    types: ["SHA1MD5HUM"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e364 SHA1MD5HUM. verified with hashpipe -c, which pins each line to its own leading TYPE label and runs no detection, at -t 1 and with the emitted label compared against the one asked for. Both precautions matter on this build: -m does not restrict what a recognised wrapper reaches, and results vary with the thread count. No iterations: is recorded from hashpipe -- the suffixes are different quantities and this repository follows mdxfind for that field."
  crack:
    supported: false
vectors:
  - hash: "6473ffc8effd698469b3ddaed36ac59c2aa0d89d:00- x 1"
    pass: "password123"
    source: "hashpipe"
    reads_in: ["mdxfind"]
