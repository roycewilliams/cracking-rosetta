tools:
  mdxfind:
    verified: "absent"
    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.576 (2026/09/02)"
    note: "RE-MEASURED 2026-09-05 against mdxfind RCS 1.576 (1027 types), because every mdxfind absence in this repository had been established against RCS 1.545 and the ones on john dynamics were additionally established by offering mdxfind a $dynamic_NNNN$ string it cannot parse. Both faults are fixed for this row: the vector was rewritten into mdxfind's own serialization and offered to full auto-detect over the whole catalog, single-threaded. The near miss is MD5DSALT (e408), whose construction md5(md5(md5(pass).salt).salt2) is exactly what john states for dynamic_16. It still cannot carry this vector: hx Appendix A Note [50] records that MD5DSALT reports its two salts in ONE field concatenated with no separator, and bounds each salt at THREE characters, so at most three splits need testing. This row's second salt is 'salt2', five characters, which no split of a three-bounded field can produce. Measured both as <digest>:<salt>:<salt2> and as the concatenated <digest>:<salt><salt2>; neither cracks. A limit of the type, not a gap here. Superseded note follows. || no type. Swept all 1002 mdxfind types on 2026-09-03 (a tools/discover-mdxfind.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. Every applicable type ran to completion; a type killed at the timeout is counted as untested and withholds this verdict. No mdxfind type name matches any identifier this entry publishes either, normalized by the separator-drift rule. Corroborated by hashpipe, a second binary built from the same catalog: handed this entry's own hash and plaintext it names no type at all. It is the more direct instrument -- it recomputes rather than cracking -- and on this corpus it named a type for 58 entries the sweep alone called silent. This is the absence of an IDENTIFIER, not of the algorithm: if mdxfind gains one, this becomes a mapping."
  john:
    cpu: ["dynamic_16"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john's own published example ciphertext for this format, recovered by john under this format. john publishes no plaintext, so the plaintext was found by handing john its own example and a candidate list -- what john recovered IS the plaintext, by construction."
  crack:
    supported: false
