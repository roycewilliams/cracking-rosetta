id: "netscape-ldap"
name: "netscape LDAP"
expression: "$c1.base64(sha1_raw($p)),c1={SHA}"
expression_proof:
  verified: "upstream"
  verified_at: "2026-09-02"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type APACHE-SHA (e457), which states \"{SHA}\" . base64(sha1_bin(pass)). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it.; TRIAGE 2026-09-05 [format-encoding]: Raw-SHA1 has its own ciphertext encoding rather than plain hex, so a generic expression cannot be checked against it however correctly it describes the computation"
category: "application"
status: "ok"
tools:
  hashcat:
    modes: [101]
    verified: "vector"
    verified_at: "2026-08-29"
    verified_with: "hashcat"
  mdxfind:
    types: ["APACHE-SHA"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["APACHE-SHA"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    cpu: ["Raw-SHA1"]
    gpu: ["raw-SHA1-opencl"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john's own test vector for this format is reproduced by mdxfind pinned to APACHE-SHA at iteration 1"
  crack:
    supported: false
vectors:
  - hash: "{SHA}0hr37OBGrw4S08OEcnks1fCBw58="
    pass: "rosetta"
    source: "sheet"
    reads_in: ["hashcat", "john", "mdxfind"]
  - hash: "{SHA}0ijZPTcJXMa+t2XnEbEwSOkvQu0="
    pass: "ccccccccc"
    source: "john"
    reads_in: ["hashcat", "john", "mdxfind"]
legacy:
  hashes_org: "NSLDAP"
