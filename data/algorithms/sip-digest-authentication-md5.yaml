id: "sip-digest-authentication-md5"
name: "SIP digest authentication (MD5)"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat mode 11400 is a Network Protocol format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "SIP digest authentication (MD5)"
  source: "hashcat"
  note: "hashcat's own label for mode 11400, category \"Network Protocol\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "protocol"
status: "ok"
tools:
