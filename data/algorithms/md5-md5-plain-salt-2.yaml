id: "md5-md5-plain-salt-2"
name: "md5(md5($plain).$salt)"
aliases: ["md5($salt.md5($plain))", "md5(substr($salt,0,1).md5($plain).substr($salt,1,1))"]
expression_proof:
  verified: "absent"
  verified_at: "2026-09-02"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type MD52SALTMD5 (e283) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "md5(salt . salt . md5(pass))"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type MD52SALTMD5 (e283), which states md5(salt . salt . md5(pass)) (Note [24]). This is what the type emits, not a single construction -- see expression_proof."
status: "ok"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["MD52SALTMD5"]
    verified: "vector"
    verified_at: "2026-08-29"
    verified_with: "mdxfind"
  hashpipe:
    types: ["MD52SALTMD5"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  crack:
    supported: false
