id: "pbkdf2-sha512-plain"
name: "pbkdf2-sha512($plain)"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "the construction upstream states for mdxfind type PBKDF2-SHA512 (e533) names pbkdf2_sha512(), which john's dynamic EXPRESSION vocabulary does not have -- checked against the function names appearing in john's own --list=subformats, so this is a lookup and not an opinion. It says nothing about whether john can CRACK this: john has formats for plenty of these constructions, and where it does they are in tools.john.cpu. The wording upstream uses is kept in denotation:."
denotation:
  text: "pbkdf2_sha512(pass, salt, N, 64)"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type PBKDF2-SHA512 (e533), which states pbkdf2_sha512(pass, salt, N, 64)."
category: "application"
status: "ok"
