id: "hmac-md5-kpass"
name: "HMAC-MD5-KPASS"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "the construction upstream states for mdxfind type HMAC-MD5-KPASS (e792) names hmac_md5(), which john's dynamic EXPRESSION vocabulary does not have -- checked against the function names appearing in john's own --list=subformats, so this is a lookup and not an opinion. It says nothing about whether john can CRACK this: john has formats for plenty of these constructions, and where it does they are in tools.john.cpu. The wording upstream uses is kept in denotation:."
denotation:
  text: "hmac_md5(salt, pass)"
  source: "mdxfind"
  note: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A, entry for mdxfind type HMAC-MD5-KPASS (e792), which states hmac_md5(salt, pass)."
category: "composite"
status: "ok"
tools:
  hashcat:
    modes: [50]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "hashcat v7.1.2-606-ge2a7ab834"
  mdxfind:
    types: ["HMAC-MD5-KPASS"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["HMAC-MD5-KPASS"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    cpu: ["HMAC-MD5"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "The same NAME means opposite things in john and mdxfind, which is what put this mapping on the wrong row. john's HMAC-* formats key on the PASSWORD -- john's own source says so, ALGORITHM_NAME is literally \"password is key\" in hmacMD5_fmt_plug.c, hmacSHA1_fmt_plug.c, hmacSHA256_fmt_plug.c and hmacSHA512_fmt_plug.c. mdxfind splits the two cases across two names: hx Appendix A gives HMAC-SHA1 (e215) as hmac_sha1(pass, user), keyed on the USER, and HMAC-SHA1-KPASS (e793) as hmac_sha1(salt, pass), keyed on the PASSWORD. So john's HMAC-SHA1 is mdxfind's HMAC-SHA1-KPASS, and matching the two by name pairs each with the wrong one. john's HMAC-MD5 recovers this row's own plaintext from its own vector once that vector is written in john's <message>#<digest> shape."
  crack:
    supported: false
vectors:
  - hash: "e62cf677521d96f7f5ea48207811a97f:testsalt"
    pass: "password123"
    source: "mdxfind"
    form: "mdxfind"
    reads_in: ["hashcat", "mdxfind"]
    credential: "hmac-md5-kpass"
  - hash: "testsalt#e62cf677521d96f7f5ea48207811a97f"
    pass: "password123"
    source: "john"
    form: "john"
    reads_in: ["john"]
    credential: "hmac-md5-kpass"
notes: "The two vectors on this row are ONE credential written twice and must never be read as corroborating each other: mdxfind reads <digest>:<salt>, john reads <message>#<digest>. The same NAME means opposite things in john and mdxfind, which is what put this mapping on the wrong row. john's HMAC-* formats key on the PASSWORD -- john's own source says so, ALGORITHM_NAME is literally \"password is key\" in hmacMD5_fmt_plug.c, hmacSHA1_fmt_plug.c, hmacSHA256_fmt_plug.c and hmacSHA512_fmt_plug.c. mdxfind splits the two cases across two names: hx Appendix A gives HMAC-SHA1 (e215) as hmac_sha1(pass, user), keyed on the USER, and HMAC-SHA1-KPASS (e793) as hmac_sha1(salt, pass), keyed on the PASSWORD. So john's HMAC-SHA1 is mdxfind's HMAC-SHA1-KPASS, and matching the two by name pairs each with the wrong one."
