  source: "hashcat"
  note: "hashcat's own label for mode 33400, category \"FTP, HTTP, SMTP, LDAP Server\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
