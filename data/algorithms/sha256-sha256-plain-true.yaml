    note: "`iterations` was corrected from 2 to 1 on 2026-09-05. The vector is right and was never in doubt; the DEPTH LABEL was wrong, inherited from a binary that reported the base one round early. mdxfind revision 1.290 (2026-04-09) regressed the RAW family -- \"the base was reported one round early, so x01 became X(pass) instead of X(X_bin(pass))\" -- and revision 1.549 (2026-08-30) restored it. Measured 2026-09-05: this entry's own stored vector reproduces under mdxfind RCS 1.576 at x01, and `hashpipe -c` pinned to the same type independently reports x01. It reproduced at x02 only under the regressed RCS 1.545, which is where the 2 came from. Note what this ALSO settles: hashpipe's john_map.h has published x01 for these types all along, and data/upstream-disagreements.yaml recorded that as an \"iteration-numbering\" convention difference. It was not a convention difference; it was this bug, and upstream's map was right."
