  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "john's own --list=subformats states dynamic_1024 as \"sha1(md5($p)) (hash truncated to length 32)\", for an identifier this row proves by round-trip, and the construction was recomputed independently here with Digest::MD5 and Digest::SHA against john's published Test= vector before it was stored. Tier stays upstream and CANNOT become vector, for the same reason sha1-substr-0-32 records: cut() has no john dynamic spelling at all (RosettaJohn %NO_JOHN), so john's compiler can never be handed this string, and there is no john_dynamic_expr on this row for the same reason -- dropping the cut would run happily and produce the full digest, not the 32 hex characters stored here."
