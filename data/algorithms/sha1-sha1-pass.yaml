notes: "dynamic_1026 and dynamic_26 were both REMOVED 2026-09-06, and with them this row's whole john block. Neither was a spelling problem. dynamic_1026 computes this row's construction CUT TO 32 hex characters; its correct home already existed, since sha1sha1trunc's stored vector IS cut(sha1(sha1($p)),0,32) -- confirmed by recomputation that day -- and it is at tier vector there. dynamic_26 is plain sha1($p): it LOADS this row's 40-hex vector and does not crack it, while the same format cracks sha1(\"rosetta\") on the first try, which is the control that separates the two readings. It has been on the sha1 row at tier vector since 2026-09-04. This row is NOT claiming john cannot do the algorithm -- its john_dynamic_expr is proven and runnable -- only that john ships no FORMAT identifier for it that anyone has reproduced here."
