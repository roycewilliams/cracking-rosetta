id: "sha1sha256truncmd5salt"
name: "SHA1SHA256TRUNCMD5SALT"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "mdxfind type SHA1SHA256TRUNCMD5SALT (e679) is MULTI-EMIT: it computes several candidate digests per input and matches if any one reproduces the stored hash. There is therefore no single expression to record, and writing one of the emitted forms into expression: would be a false claim even though the string itself is correct. This is also why two vectors of such a type can disagree with each other, and why a tool matching one of them is not evidence about the other."
denotation:
  text: "sha1(cut(sha256(md5(pass)), 0, N) . salt)"
  source: "mdxfind"
  note: "hx Language Specification, Appendix A, vendored as vendor/cynosureprime/hx.8 at commit 2139193c, entry for mdxfind type SHA1SHA256TRUNCMD5SALT (e679), which states sha1(cut(sha256(md5(pass)), 0, N) . salt). CORRECTED 2026-09-05: this entry recorded sha1(md5(cut(sha256(pass), 0, N)) . salt), and the two disagreed about the algorithm. The md5 is applied to the PASSWORD, before the sha256, not to the truncation after it. The case body reads mymd5(cur, len, curin.h); cur = prmd5(curin.h, mdbuf, 32); len = 32; and then FALLS THROUGH to the plain sha256 case, so the order is md5, then sha256, then the truncation, then sha1. The text recorded here put the md5 outside the cut, which is a different algorithm. mdxfind.c is authoritative and it agrees with the specification, so the entry is what changed. Found by tools/audit-denotations.pl, which compares every denotation against the vendored appendix."
