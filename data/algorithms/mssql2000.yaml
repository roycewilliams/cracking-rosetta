id: "mssql2000"
name: "MSSQL2000"
expression: "sha1(utf16($p).$s)"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type MSSQL2000 (e850), which states sha1(utf16le(pass) . salt). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it.; TRIAGE 2026-09-05 [format-encoding]: mssql has its own ciphertext encoding rather than plain hex, so a generic expression cannot be checked against it however correctly it describes the computation"
category: "composite"
status: "needs-review"
tools:
  hashcat:
    modes: [131]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "hashcat v7.1.2-606-ge2a7ab834"
  mdxfind:
    types: ["MSSQL2000"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["MSSQL2000"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    cpu: ["mssql"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "john --format=mssql recovers the vector, but as PASSWORD123: the format attacks the case-insensitive half of an MSSQL2000 hash, so the plaintext it returns is the case-folded one and the round-trip cannot match the recorded pass exactly. john --format=mssql05 does return the exact plaintext, by reading only the 2005-shaped prefix of the same hash, and is deliberately NOT recorded here"
  crack:
    supported: false
vectors:
  - hash: "0x010012345678f9cf12a8bbcee0131a6068815203371250b5cb1198069a7aec5df5cb05ef43f73acbe8572cf9d744"
    pass: "password123"
    source: "mdxfind"
    form: "mdxfind"
    reads_in: ["john", "mdxfind"]
  - hash: "0x0100778883860000000000000000000000000000000000000000eda3604e067a06f2732b05b9cb90b8a710996939"
    pass: "HASHCAT"
    source: "hashcat"
    reads_in: ["hashcat", "john"]
