id: "mssql2000"
name: "MSSQL2000"
expression: "sha1(utf16($p).$s)"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type MSSQL2000 (e850), which states sha1(utf16le(pass) . salt). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it. Not checkable locally: the construction uses functions RosettaExpr cannot compile, so this rests on upstream's word alone.; TRIAGE 2026-09-02 [format-encoding]: mssql has its own ciphertext encoding rather than plain hex, so a generic expression cannot be checked against it however correctly it describes the computation"
category: "composite"
status: "needs-review"
tools:
  hashcat:
    modes: [131]
    verified: "vector"
    verified_at: "2026-08-30"
    verified_with: "hashcat"
  mdxfind:
    types: ["MSSQL2000"]
    verified: "vector"
    verified_at: "2026-08-29"
    verified_with: "mdxfind"
  john:
    cpu: ["mssql"]
    verified: "vector"
    verified_at: "2026-08-30"
    verified_with: "john"
    note: "john --format=mssql recovers the vector, but as PASSWORD123: the format attacks the case-insensitive half of an MSSQL2000 hash, so the plaintext it returns is the case-folded one and the round-trip cannot match the recorded pass exactly. john --format=mssql05 does return the exact plaintext, by reading only the 2005-shaped prefix of the same hash, and is deliberately NOT recorded here"
  crack:
    supported: false
