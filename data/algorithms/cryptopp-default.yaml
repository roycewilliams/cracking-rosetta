id: "cryptopp-default"
name: "CRYPTOPPDEFAULT"
aliases: ["Crypto++ DefaultEncryptor (modern)"]
denotation:
  text: "salt(8) . aes_cbc(key=mash_sha256(pass . salt, 2500)[0:32], iv=mash_sha256(pass . salt, 2500)[32:48], sha256(pass . salt)[0:16] . plaintext . pkcs5)"
  source: "human"
  note: "Read from Crypto++ upstream default.cpp/default.h. Not expressible in hx: the construction ENCRYPTS rather than hashes, and hx has no CBC block-cipher spelling."
category: "application"
application: "Crypto++ DataEncryptor"
status: "ok"
tools:
  hashcat:
    verified: "absent"
    verified_at: "2026-09-19"
    verified_with: "hashcat mode list, v7.1.2"
    note: "no mode names this construction."
  mdxfind:
    types: ["CRYPTOPPDEFAULT"]
    verified: "vector"
    verified_at: "2026-09-19"
    verified_with: "mdxfind RCS 1.595 (2026/09/18)"
  hashpipe:
    types: ["CRYPTOPPDEFAULT"]
    verified: "vector"
    verified_at: "2026-09-19"
    verified_with: "hashpipe RCS 1.198 (2026/09/18)"
    note: "verified by round-tripping the type PINNED with -m. Cross-checked: this vector does NOT verify under CRYPTOPPLEGACY, and that entry's vector does not verify here."
  crack:
    supported: false
vectors:
  - hash: "0123456789ABCDEF3EE042F5D20F9FE50E19BB2ECDBC86F6C9E9C06F7788B523CEB2ECD09700248D:secret"
    pass: "password123"
    source: "upstream Crypto++"
    reads_in: ["mdxfind"]
notes: |
  The MODERN Crypto++ DefaultEncryptor. See cryptopp-legacy for the naming trap:
  a 1998-era DefaultEncryptor is a DIFFERENT construction, DES-EDE2 with SHA-1 at
  200 iterations, which modern Crypto++ calls LegacyEncryptor.

  NO FIELD EVIDENCE. This entry is verified bidirectionally against a locally
  built upstream libcryptopp.a, which establishes the algorithm and says nothing
  about whether any deployed application emits it. cryptopp-legacy, by contrast,
  has been confirmed against real records from a live site. Do not read a
  CRYPTOPPDEFAULT hit as a record from a known product.

  THIS IS ENCRYPTION, NOT HASHING; the operational notes in cryptopp-legacy apply
  unchanged. The key is site-wide, a candidate stream of user passwords recovers
  nothing, one key decrypts an entire installation, and cost is independent of
  record count.

  RECORD LENGTH differs usefully from cryptopp-legacy. AES has a 16-byte block and
  the check block is 16 bytes rather than 8, so stored length is
  8 + 16 + plaintext rounded up to a multiple of 16. That makes the two
  distinguishable by length whenever the value is not also a digest length.
