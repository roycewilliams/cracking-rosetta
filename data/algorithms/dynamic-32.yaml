notes: "The two vectors on this row are ONE credential written twice and must never be read as corroborating each other. john writes $dynamic_32$<digest>$<salt>; mdxfind reads <digest>:<salt>. The re-encoding was proven rather than assumed: mdxfind pinned to MD4PASSSALT recovers this row's own stated plaintext from the rewritten string, and the field-swapped control does not crack, so the field order is measured and not guessed."
