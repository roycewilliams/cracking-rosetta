    match: ["hash-transcoded"]
    note: "Round-tripped on the TRANSCRIBED form, not on the vector as stored: this entry keeps its vector in another tool's serialization, which mdxfind's reader does not parse. mdxfind pinned with -h reproduced MD4PASSSALT as \"7587e30d68ce5d7e2d4e7d98a8f69ff5:RAkUuD88:test1\", from data/mdxfind-transcodes.tsv. The plaintext is one this entry already stores, and the two strings are ONE piece of evidence written twice -- not two agreeing vectors. mdxfind e1004 MD4PASSSALT, reached by rewriting this row's vector into mdxfind's serialization: john writes $dynamic_32$<digest>$<salt>; mdxfind reads <digest>:<salt>."
