id: "sapcodvnh384"
name: "SAPCODVNH384"
expression_proof:
  verified: "absent"
  verified_at: "2026-09-05"
  verified_with: "hx Language Specification, Appendix A"
  note: "the iteration count is a runtime parameter read out of the stored form, per Appendix A Note [41]."
denotation:
  text: "SAP CODVN H, SHA-384 flavour: h = sha384(pass . salt) for the first round and h = sha384(pass . h) for each of the remaining ITER-1 rounds, password truncated at 40 characters"
  source: "mdxfind"
  note: "Appendix A Note [41], same as the SHA-256 flavour: the iteration count is carried in the hash, so this is documentation rather than a compilable expression. hx Language Specification (Waffle), Appendix A, read 2026-09-05. The revision is later than the 1.15 the seeding tools cite, since Appendix A now carries e1003-e1027."
category: "application"
status: "ok"
