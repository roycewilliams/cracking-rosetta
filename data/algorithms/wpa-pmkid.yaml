relations:
  - kind: "covered-by"
    entry: "wpa-pbkdf2-pmkid-eapol"
    distinction: "naming"
    note: "hashcat 22000 \"WPA-PBKDF2-PMKID+EAPOL\" accepts EITHER artifact -- a PMKID or an EAPOL handshake -- where wpa-pmkid carries one of the two. So this is NOT same-computation: for a given input the two agree exactly, and the covering identifier additionally accepts inputs the other does not. hashcat's own mode name states the union, so unlike a row that overstates its own scope, this row names its identifier faithfully and no merge is owed. 'covers' was added to the vocabulary on 2026-09-08 for exactly this, decided by Royce: same-computation overstates it and collides-on-subset means the opposite thing. Measured 2026-09-08, not read off the two names. The corpus holds three WPA serializations, one per generation of tooling -- hashcat's hccapx (2500/2501), its pmkid line (16800/16801) and the WPA*NN* form -- and no sweep had ever related these rows because each tool is silent about another tool's spelling, which is not evidence. tmp/wpa-canon.pl converts all three to WPA*NN*, checking hccapx's HCPX magic first because every field after it is positional. 2500 and 2501 turn out to carry the IDENTICAL blob, and 16800/16801 the identical PMKID and MACs: each pair is one credential asked two ways. Every claim here is a round trip against hashcat v7.1.2-606 and mdxfind RCS 1.579, each with a WRONGCANDIDATE control that found nothing."
  - kind: "same-computation"
    entry: "wpa-pmkid-pbkdf2"
    distinction: "naming"
    note: "One computation under two tools' names: mdxfind WPA-PMKID and hashcat 16800 (WPA-PMKID-PBKDF2). Both rows' own credentials were reproduced by a SINGLE identifier, which is what makes this same-computation rather than a resemblance. Measured 2026-09-08, not read off the two names. The corpus holds three WPA serializations, one per generation of tooling -- hashcat's hccapx (2500/2501), its pmkid line (16800/16801) and the WPA*NN* form -- and no sweep had ever related these rows because each tool is silent about another tool's spelling, which is not evidence. tmp/wpa-canon.pl converts all three to WPA*NN*, checking hccapx's HCPX magic first because every field after it is positional. 2500 and 2501 turn out to carry the IDENTICAL blob, and 16800/16801 the identical PMKID and MACs: each pair is one credential asked two ways. Every claim here is a round trip against hashcat v7.1.2-606 and mdxfind RCS 1.579, each with a WRONGCANDIDATE control that found nothing. The two rows also store their vectors in different serializations, but that is not WHY both exist: each row is where a reader arrives from a different tool's identifier, which is what distinction 'naming' means."
