id: "password-safe-v2"
name: "Password Safe v2"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "hashcat v7.1.2-549-g8a15e210b"
  note: "hashcat 9000 is a container or application format. john's dynamic expression language describes constructions over a password and a salt; it cannot express a container's KDF-plus-cipher, so this has no expression and will not acquire one. That says nothing about whether john can CRACK it -- run discover-john.pl, and if john has a format it goes in tools.john."
denotation:
  text: "Password Safe v2"
  source: "hashcat"
  note: "hashcat's own label for 9000, category \"Password Manager\", in v7.1.2-549-g8a15e210b. This is a container or application format rather than a bare construction, so there is no single digest expression to record."
category: "application"
status: "needs-review"
tools:
  hashcat:
    modes: [9000]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "Round-tripped, but attributed by a SOLO run, because under mode(s) 9000 hashcat's parser reads the FILE'S BYTES, and this entry stores the container header as hex because YAML holds text, so the round trip was run against the decoded bytes. The stored hex is unchanged and is what decodes to them; reads_in does NOT list hashcat for it, because hashcat did not read that string. One hash and one candidate per invocation leaves nothing else the crack could belong to. The stored vector is unchanged."
  crack:
    supported: false
vectors:
  - hash: ""
    pass: "hashcat"
    source: "hashcat"
