tools:
  hashcat:
    modes: [5100]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "hashcat v7.1.2-606-ge2a7ab834"
  mdxfind:
    types: ["MD5"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "mdxfind RCS 1.545 (2026/08/29)"
    note: "type discovered by round-trip search, not by name. The RAW type was dropped from this mapping on 2026-09-05 because it was never true. mdxfind revision 1.290 (2026-04-09) regressed the RAW family so that every RAW type became numerically identical to its plain sibling at x01 -- upstream's own words in revision 1.549, which restored the correct semantics on 2026-08-30. This row's vector is the PLAIN digest (or a truncation of one), so under the regression it verified as the RAW type as well, and the mapping reached tier `vector` on a coincidence rather than on the algorithm. Measured 2026-09-05 by tmp/binary-diff.pl over all 1294 mdxfind vector claims: this claim reproduces under mdxfind RCS 1.545 and NOT under RCS 1.576. hashpipe settles which is right and it is 1.576 -- its own SHA224 example is exactly sha224 of its plaintext while its SHA224RAW example is a different digest entirely, so RAW and plain differ in the third implementation too. The plain type remains and still verifies against the installed binary; nothing else on this row changes."
  john:
    verified: "absent"
    verified_at: "2026-09-04"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "no format. Swept the 3 format(s) whose own valid() accepts this entry's own vector, as john --show=left reports them, on 2026-09-04 (a tools/discover-john.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. For john the control is also per ENTRY and not only per shape: every format counted above is one whose own loader ACCEPTED this hash, so each was asked this exact question and answered no. A format that cannot parse the hash is not counted at all, and an entry no format can parse is reported as unsearched rather than decided. Every applicable format ran to completion; a format killed at the timeout is counted as untested and withholds this verdict. No john format name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if john gains one, this becomes a mapping."
  crack:
    supported: false
relations:
  - kind: "iterates"
    entry: "md5-md5-md5-md5-md5-pass"
    distinction: "iteration"
    note: "Both rows name mdxfind type MD5; this one at -i 5 and half-md5 at -i 1. The iteration suffix is part of the identity (MD5x02 is john's dynamic_2, MD5x03 its dynamic_3), so these are two algorithms and not two names. Edge written 2026-09-07 from the data: same type, different iterations: is what `iterates` means, and no judgment was involved."
