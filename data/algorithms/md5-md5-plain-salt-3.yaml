notes: "IDENTIFIED 2026-08-31 by Cynosure Prime's maintainer and confirmed here by an independent Digest::MD5 computation: the vector d4f7dec5b98ac42336b1c9e56f2e5ca8:abc123 (plaintext 'rosetta') is md5(md5($p).\":\".$u) -- mdxfind/hashpipe type MD5MD5USER, which inserts a LITERAL COLON between the inner digest and the userid field (hx.pdf note 24, p.58). The earlier 198,534-construction sweep missed it because it enumerated terms and never a literal separator between them. The colon is not a general convention for userid types: md5-userid-md5-plain (MD5USERIDMD5) and sha1-sha1-plain-salt (SHA1SHA1USER) both reproduce without it, checked the same day. CONSEQUENCE, still open: this entry carries vectors of TWO constructions -- 05b56c69b512a1c641fc59d1070df60b is md5(md5($p).$s), which is this entry's expression and what john's dynamic_1007 proves, while d4f7dec5 is the colon form, which is what this entry's mdxfind type MD5MD5USER denotes and what mdxfind's tier was proven on. One entry, two computations; splitting it is a curation decision. Note also that john's dynamic compiler rejects a literal string ('Invalid token following the . character'), so the colon form can have no john expression at all."
