id: "md5-md5-plain-salt-3"
name: "md5(md5($plain).\":\".$username)"
expression_proof:
  verified: "absent"
  verified_at: "2026-08-31"
  verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
  note: "john's dynamic expression language has no literal-string token: --format=dynamic='md5(md5($p).\":\".$s)' fails with 'Invalid token following the . character' (checked 2026-08-31), so this construction cannot be written as an expression. That is separate from whether john has a FORMAT for it."
denotation:
  text: "md5(md5($p).\":\".$u)"
  source: "mdxfind"
status: "ok"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["MD5MD5USER"]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "mdxfind RCS 1.540 (2026/08/22)"
  john:
    verified: "absent"
    verified_at: "2026-08-31"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "no john format reproduces this construction: discover-john.pl ran all 957 formats (439 CPU + 518 disabled dynamics) against this entry's vector in 38.5s with zero matches, 2026-08-31. Separately, the dynamic expression compiler cannot express it either -- it has no literal-string token. The dynamic_1007/2006/6 this entry used to name belong to the colonless md5(md5($p).$s) and do not crack this vector."
  crack:
    supported: false
relations:
  - kind: "collides-on-subset"
    entry: "md5-capitalise-md5-plain-username"
    distinction: "encoding"
    note: "MD5MD5USER and MD5CAPMD5USER differ only by cap() on the inner hex digest, which is a no-op whenever that digest starts with a digit. md5('rosetta') is 975790df..., so both types reproduce this shared vector identically; they diverge on any plaintext whose md5 starts with a letter."
vectors:
  - hash: "d4f7dec5b98ac42336b1c9e56f2e5ca8:abc123"
    pass: "rosetta"
    source: "sheet"
legacy:
  hashes_org: "MD5(MD5(PLAIN)SALT)"
notes: "This row is mdxfind type MD5MD5USER, which computes md5(md5($p).\":\".$u) -- a literal colon between the inner digest and the userid field (hx.pdf note 24, p.58). Identified 2026-08-31 by Cynosure Prime's maintainer and confirmed here twice over: an independent Digest::MD5 computation reproduces the vector, and the local mdxfind pinned to ^MD5MD5USER$ with -F recovers the plaintext. CORRECTED the same day. This entry previously claimed expression md5(md5($p).$s) and john dynamic_1007/2006/6, all of which belong to the DIFFERENT, colonless construction; none of those three dynamics cracks this entry's vector, checked 2026-08-31. The colonless vector 05b56c69b512a1c641fc59d1070df60b and the vanity vector it carried moved to md5-md5-pass-salt, which is that computation's row. The earlier 198,534-construction sweep that failed to identify this missed it because it enumerated terms and never a literal separator between them; the colon is NOT a general convention for userid types -- MD5USERIDMD5 and SHA1SHA1USER both reproduce without it."
