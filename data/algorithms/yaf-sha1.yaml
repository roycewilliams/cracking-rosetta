id: "yaf-sha1"
name: "YAF-SHA1"
expression: "base64(sha1_raw(utf16($p).frombase64($s)))"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type YAF-SHA1 (e459), which states base64(sha1_bin(utf16le(pass) . frombase64(salt))). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it.; TRIAGE 2026-09-08 [native-serialization]: no john format, and RosettaExpr can compute this expression but none of the entry's 1 vector(s) is a bare digest to compare it against -- each is in a tool's own serialization, or lacks a salt the expression needs. The expression is unchecked, not contradicted"
category: "composite"
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["YAF-SHA1"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["YAF-SHA1"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e459 YAF-SHA1. verified with hashpipe -c, which pins each line to its own leading TYPE label and runs no detection, at -t 1 and with the emitted label compared against the one asked for. Both precautions matter on this build: -m does not restrict what a recognised wrapper reaches, and results vary with the thread count. No iterations: is recorded from hashpipe -- the suffixes are different quantities and this repository follows mdxfind for that field."
  crack:
    supported: false
vectors:
  - hash: "YUP9EPH6qT7jBfUkagiaK2Np0lk= AQIDBA=="
    pass: "password123"
    source: "hashpipe"
    reads_in: ["mdxfind"]
