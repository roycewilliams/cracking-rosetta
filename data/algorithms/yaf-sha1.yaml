id: "yaf-sha1"
name: "YAF-SHA1"
expression: "base64(sha1_raw(utf16($p).frombase64($s)))"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type YAF-SHA1 (e459), which states base64(sha1_bin(utf16le(pass) . frombase64(salt))). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it.; TRIAGE 2026-09-04 [no-john-format]: no john format on this entry, so john ships no control vectors, and the entry carries no vector of its own to check the expression against. The sentence \"Not checkable locally: ... RosettaExpr cannot compile\" was withdrawn on 2026-09-04: RosettaExpr was widened by sha224, sha384 and the utf16 family and compiles this expression, so the claim was false. The tier is untouched -- what changed is this repository's reach, not the evidence."
category: "composite"
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["YAF-SHA1"]
    verified: "asserted"
  crack:
    supported: false
