id: "yaf-sha1"
name: "YAF-SHA1"
expression: "base64(sha1_raw(utf16($p).frombase64($s)))"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type YAF-SHA1 (e459), which states base64(sha1_bin(utf16le(pass) . frombase64(salt))). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it.; TRIAGE 2026-09-04 [no-john-format]: no john format on this entry, so john ships no control vectors, and the entry carries no vector of its own to check the expression against. The sentence \"Not checkable locally: ... RosettaExpr cannot compile\" was withdrawn on 2026-09-04: RosettaExpr was widened by sha224, sha384 and the utf16 family and compiles this expression, so the claim was false. The tier is untouched -- what changed is this repository's reach, not the evidence."
category: "composite"
status: "needs-review"
tools:
  hashcat:
    verified: "absent"
  mdxfind:
    types: ["YAF-SHA1"]
    verified: "vector"
    verified_at: "2026-09-04"
    verified_with: "mdxfind"
  hashpipe:
    types: ["YAF-SHA1"]
    verified: "vector"
    verified_at: "2026-09-05"
    verified_with: "hashpipe RCS 1.193 (2026/09/05)"
    note: "hashpipe e459 YAF-SHA1. verified with hashpipe -c, which pins each line to its own leading TYPE label and runs no detection, at -t 1 and with the emitted label compared against the one asked for. Both precautions matter on this build: -m does not restrict what a recognised wrapper reaches, and results vary with the thread count. No iterations: is recorded from hashpipe -- the suffixes are different quantities and this repository follows mdxfind for that field."
  crack:
    supported: false
vectors:
  - hash: "YUP9EPH6qT7jBfUkagiaK2Np0lk= AQIDBA=="
    pass: "password123"
    source: "hashpipe"
    reads_in: ["mdxfind"]
