id: "macosx"
name: "MACOSX"
expression: "sha1(fromhex($s).$p)"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type MACOSX (e853), which states sha1(fromhex(salt) . pass) (macOS 10.4-10.6; salt is hex-decoded). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it. Checked by hand on 2026-08-31 anyway: Digest::SHA -- an implementation independent of all three crackers -- computes exactly this construction over the entry's own vector and reproduces its digest. That is corroboration, not tier 'vector', which requires john's own compiler; john has no fromhex() in its dynamic expression language, so derive-expressions.pl cannot promote this.; TRIAGE 2026-09-05 [native-serialization]: no john format, and RosettaExpr can compute this expression but none of the entry's 1 vector(s) is a bare digest to compare it against -- each is in a tool's own serialization, or lacks a salt the expression needs. The expression is unchecked, not contradicted"
category: "application"
status: "needs-review"
tools:
  hashcat:
    modes: [122]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "hashcat v7.1.2-606-ge2a7ab834"
  mdxfind:
    types: ["MACOSX"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "mdxfind RCS 1.579 (2026/09/06)"
  hashpipe:
    types: ["MACOSX"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    verified: "absent"
    verified_at: "2026-09-04"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "no format. Swept the 17 format(s) whose own valid() accepts this entry's own vector, as john --show=left reports them, on 2026-09-04 (a tools/discover-john.pl sweep, evidence read by tools/absence.pl): not one reproduced this entry's own vector. That the vector was IN the search is not assumed -- the same sweep reported a hit on another vector of the same shape, a positive control measured in the same run by the same binary, and without it finding nothing would not be evidence. For john the control is also per ENTRY and not only per shape: every format counted above is one whose own loader ACCEPTED this hash, so each was asked this exact question and answered no. A format that cannot parse the hash is not counted at all, and an entry no format can parse is reported as unsearched rather than decided. Every applicable format ran to completion; a format killed at the timeout is counted as untested and withholds this verdict. No john format name matches any identifier this entry publishes either, normalized by the separator-drift rule. This is the absence of an IDENTIFIER, not of the algorithm: if john gains one, this becomes a mapping."
