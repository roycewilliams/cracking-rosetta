expression: "sha1(fromhex($s).$p)"
expression_proof:
  verified: "upstream"
  verified_at: "2026-08-31"
  verified_with: "hx Language Specification $Revision: 1.15$ (Waffle, Aug 2026), Appendix A"
  note: "transcribed from the hx specification's Appendix A entry for mdxfind type MACOSX (e853), which states sha1(fromhex(salt) . pass) (macOS 10.4-10.6; salt is hex-decoded). Transcription, not reproduction, so this is upstream and not vector; run derive-expressions.pl to try to promote it. Not checkable locally: the construction uses functions RosettaExpr cannot compile, so this rests on upstream's word alone. Checked by hand on 2026-08-31 anyway: Digest::SHA -- an implementation independent of all three crackers -- computes exactly this construction over the entry's own vector and reproduces its digest. That is corroboration, not tier 'vector', which requires john's own compiler; john has no fromhex() in its dynamic expression language, so derive-expressions.pl cannot promote this."
