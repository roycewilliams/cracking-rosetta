tools:
  hashcat:
    modes: [0]
    verified: "vector"
    verified_at: "2026-08-31"
    verified_with: "hashcat v7.1.2-549-g8a15e210b"
    note: "was mode 4300 until 2026-08-31, which is a DIFFERENT computation: 4300 is md5(strtoupper(md5($pass))), already carried correctly by md5-strtoupper-md5-pass. MD5UC is md5 written in uppercase hex -- an encoding, not a second hashing round -- and hashcat folds hex case on load, so mode 0 reads this entry's uppercase vector and echoes it back lowercase. Verified 2026-08-31 against this entry's own vector."
  mdxfind:
    types: ["MD5UC"]
    verified: "upstream"
    verified_at: "2026-08-29"
    verified_with: "RCS 1.540 (2026/08/22)"
    no_round_trip:
      reason: "not-comparable"
      note: "mdxfind cannot present this row's vector, and that is a property of how it compares rather than a defect. It converts a loaded hash to binary, so upper(md5($p)) and md5($p) are the same bytes to it -- offer it this row's digest and it answers MD5x01, because that is what those bytes are. A type distinguished only by hex case therefore cannot exist for mdxfind at depth one, and the first depth it can present is one hash further on, which it reports as MD5UCx02. hashpipe compares the stored text, can tell the two apart, and verifies this row's vector as MD5UCx01. Both are correct and they are not in conflict: each reports the first value its own comparison can distinguish. Appendix A's row, md5_uc(pass), states the construction both implement. Measured 2026-09-05 against mdxfind RCS 1.576 and hashpipe RCS 1.193."
      measured_at: "2026-09-05"
      measured_with: "mdxfind RCS 1.576 (2026/09/02); hashpipe RCS 1.193 (2026/09/05)"
  hashpipe:
    types: ["MD5UC"]
    verified: "vector"
    verified_at: "2026-09-03"
    verified_with: "hashpipe RCS 1.189 (2026/09/02)"
    note: "verified by round-tripping each type PINNED with -m, not by taking an unpinned report: hashpipe names the FIRST type that reproduces a digest, so an unpinned answer names a type that works and not necessarily this one."
  john:
    cpu: ["Raw-MD5", "dynamic_0", "dynamic_2000"]
    verified: "vector"
    verified_at: "2026-09-07"
    verified_with: "john 1.9.0-jumbo-1+bleeding-9a336d800a 2026-08-02 00:19:48 +0200"
    note: "format discovered by round-trip search, not by name"
  crack:
    supported: false
